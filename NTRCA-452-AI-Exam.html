ndexing & Hashing", "question": "মাল্টি-লেভেল ইনডেক্সিংয়ের সবচেয়ে ভেতরের বা নিচের লেভেলটি সাধারণত কী ধরণের ইনডেক্স হয়?", "options": ["ক) Primary Sparse Index", "খ) Primary Dense Index", "গ) Secondary Non-key Index", "ঘ) B+ Tree Root"], "answer": "খ", "explanation": "মাল্টিলেভেল ইনডেক্সে প্রথম স্তরটি সাধারণত বেস ডেটা ফাইলের ওপর Dense Index থাকে এবং পরবর্তী উচ্চ স্তরগুলো Sparse Index হিসেবে সেই ইনডেক্স ফাইলের ওপর কাজ করে।"}, {"id": 127, "topic": "Indexing & Hashing", "question": "বিটম্যাপ ইনডেক্সিং (Bitmap Indexing) কোন ধরণের কলামের জন্য সবচেয়ে বেশি উপযোগী?", "options": ["ক) অত্যন্ত উচ্চ কার্ডিনালিটি বিশিষ্ট কলাম (যেমন ন্যাশনাল আইডি, ফোন নম্বর)", "খ) নিম্ন কার্ডিনালিটি বিশিষ্ট কলাম (Low Cardinality, যেমন জেন্ডার, বৈবাহিক অবস্থা, রক্তের গ্রুপ)", "গ) দীর্ঘ টেক্সট বা প্যারাগ্রাফ কলাম", "ঘ) ভাসমান দশমিক সংখ্যা"], "answer": "খ", "explanation": "যেসব কলামে মাত্র কয়েকটি স্বতন্ত্র মান থাকে (Low Cardinality), সেগুলোতে বিট অ্যারে (০ এবং ১) দিয়ে তৈরি Bitmap Index অত্যন্ত কম জায়গা নেয় এবং দ্রুত বিটওয়াইজ AND/OR কুয়েরি সম্পন্ন করে।"}, {"id": 128, "topic": "Indexing & Hashing", "question": "একটি টেবিলের একাধিক কলামের ওপর যৌথভাবে তৈরি করা ইনডেক্সকে কী বলা হয়?", "options": ["ক) Composite Index বা Concatenated Index", "খ) Clustered Index", "গ) Sparse Index", "ঘ) Hash Index"], "answer": "ক", "explanation": "যখন দুটি বা ততোধিক কলামকে একসাথে নিয়ে একটি ইনডেক্স তৈরি করা হয় (যেমন `CREATE INDEX idx ON emp(dept_id, salary)`), তাকে Composite বা Compound Index বলে।"}, {"id": 129, "topic": "Indexing & Hashing", "question": "B-Tree-র প্রতিটি নোডে কি এবং চাইল্ড পয়েন্টারের সংখ্যার সম্পর্ক কী?", "options": ["ক) নোডে $k$ টি কি থাকলে চাইল্ড পয়েন্টার থাকবে $k+1$ টি", "খ) নোডে $k$ টি কি থাকলে চাইল্ড পয়েন্টার থাকবে $k$ টি", "গ) নোডে $k$ টি কি থাকলে চাইল্ড পয়েন্টার থাকবে $2k$ টি", "ঘ) কোনো নির্দিষ্ট সম্পর্ক নেই"], "answer": "ক", "explanation": "সার্চ কি ভ্যালুগুলো চাইল্ড পয়েন্টারগুলোর মাঝখানে বিভাজক হিসেবে থাকে, তাই $k$ টি কী-র জন্য ঠিক $k+1$ টি সাব-ট্রি পয়েন্টার থাকে।"}, {"id": 130, "topic": "Indexing & Hashing", "question": "হ্যাশ ফাংশনের আদর্শ বৈশিষ্ট্য কোনটি?", "options": ["ক) সমস্ত কি-কে একই বাকেটে পাঠানো", "খ) কি-গুলোকে সমস্ত বাকেটের মধ্যে সমানভাবে (Uniform Distribution) ও দৈবচয়নভাবে (Random Distribution) বণ্টন করা", "গ) প্রতিটি কলের জন্য আলাদা ফল দেওয়া", "ঘ) আউটপুট সাইজ সীমাহীন বড় হওয়া"], "answer": "খ", "explanation": "একটি ভালো হ্যাশ ফাংশন সমস্ত সার্চ কি ভ্যালুকে বাকেট রেঞ্জের ওপর সমানভাবে ও সুষমভাবে ছড়িয়ে দেয় যেন বাকেট ওভারফ্লো ও কোলিশন সর্বনিম্ন থাকে।"}, {"id": 131, "topic": "Indexing & Hashing", "question": "সেকেন্ডারি ইনডেক্স (Secondary Index) সর্বদা কোন ধরণের ইনডেক্স হতে বাধ্য?", "options": ["ক) Sparse Index", "খ) Dense Index", "গ) Dynamic Hash Index", "ঘ) Non-unique Index"], "answer": "খ", "explanation": "যেহেতু সেকেন্ডারি ইনডেক্সের কি অনুযায়ী ডেটা ফাইল ফিজিক্যালি সর্ট করা থাকে না, তাই প্রতিটি রেকর্ডের সঠিক অবস্থান নিশ্চিত করতে এটি অবশ্যই Dense Index হতে হয়।"}, {"id": 132, "topic": "Indexing & Hashing", "question": "B+ Tree-তে নতুন কি ইনসার্ট করার সময় লিফ নোড পূর্ণ থাকলে কী ঘটে?", "options": ["ক) নোডটি স্প্লিট (Split) হয়ে দুটি নোডে বিভক্ত হয় এবং মাঝের কী-র কপি প্যারেন্ট নোডে পাঠানো হয়", "খ) ইনসার্ট অপারেশন বন্ধ হয়ে যায়", "গ) পুরোনো কি স্বয়ংক্রিয়ভাবে ডিলিট হয়ে যায়", "ঘ) ট্রি-র উচ্চতা প্রতিবার দ্বিগুণ হয়"], "answer": "ক", "explanation": "নোড পূর্ণ হলে নোডটিকে অর্ধেক করে দুটি নতুন নোড তৈরি করা হয় এবং বিভক্তকারী কী-র একটি কপি প্যারেন্ট নোডে পুশ আপ করা হয়।"}, {"id": 133, "topic": "Indexing & Hashing", "question": "কোনো কুয়েরি যদি টেবিলের ডেটা ব্লকে না গিয়ে কেবলমাত্র ইনডেক্স থেকেই সমস্ত কাঙ্ক্ষিত কলামের উত্তর দিয়ে দিতে পারে, তবে সেই ইনডেক্সকে কী বলে?", "options": ["ক) Covering Index", "খ) Dense Index", "গ) Primary Index", "ঘ) Bitmap Index"], "answer": "ক", "explanation": "Covering Index এমন একটি ইনডেক্স যাতে কুয়েরির SELECT এবং WHERE ক্লজের সমস্ত কলাম বিদ্যমান থাকে, ফলে মূল টেবিলে ডিস্ক I/O এক্সেসের প্রয়োজন হয় না।"}, {"id": 134, "topic": "Indexing & Hashing", "question": "অতিরিক্ত ইনডেক্স তৈরির প্রধান নেতিবাচক দিক (Drawback) কোনটি?", "options": ["ক) SELECT কুয়েরি ধীর হয়", "খ) INSERT, UPDATE, DELETE অপারেশনের সময় প্রতিবার ইনডেক্স আপডেট করতে হয় বিধায় রাইট পারফরম্যান্স কমে যায় এবং অতিরিক্ত ডিস্ক স্পেস লাগে", "গ) ডেটাবেজ লক হয়ে যায়", "ঘ) ব্যাকআপ নেওয়া অসম্ভব হয়ে পড়ে"], "answer": "খ", "explanation": "ইনডেক্স রিড অপারেশন দ্রুত করলেও প্রতিবার ডেটা মডিফিকেশনের (DML) সময় সংশ্লিষ্ট সকল ইনডেক্স ট্রি আপডেট ও রি-ব্যালেন্স করতে হয়, যা রাইট পারফরম্যান্সে ওভারহেড তৈরি করে।"}, {"id": 135, "topic": "Indexing & Hashing", "question": "একটি B+ Tree-র উচ্চতা (Height) বৃদ্ধি পায় কখন?", "options": ["ক) প্রতিবার যেকোনো লিফ নোড বিভক্ত হলে", "খ) যখন রুট নোডটি স্প্লিট হয়ে দুটি নোড তৈরি করে এবং তাদের উপরে একটি নতুন রুট নোড যুক্ত হয়", "গ) যখন ডেটা ডিলিট করা হয়", "ঘ) প্রতি ১০০টি ইনসার্টেশনের পর"], "answer": "খ", "explanation": "B+ Tree সর্বদা নিচ থেকে উপরের দিকে বৃদ্ধি পায়। যখন সর্বোচ্চ রুট নোড উপচে গিয়ে স্প্লিট হয়, তখনই কেবল ট্রি-র উচ্চতা ১ স্তর বৃদ্ধি পায়।"}, {"id": 136, "topic": "Query Processing & Optimization", "question": "DBMS-এ কুয়েরি প্রসেসিংয়ের প্রধান তিনটি ধাপের সঠিক ক্রম কোনটি?", "options": ["ক) Optimization -> Parsing -> Execution", "খ) Parsing and Translation -> Query Optimization -> Query Execution (Evaluation)", "গ) Evaluation -> Optimization -> Parsing", "ঘ) Translation -> Indexing -> Scanning"], "answer": "খ", "explanation": "প্রথমে SQL পার্স ও সিনট্যাক্স চেক করে রিলেশনাল অ্যালজেবরা এক্সপ্রেশনে রূপান্তর করা হয়, তারপর অপটিমাইজার সবচেয়ে কম খরচের এক্সিকিউশন প্ল্যান তৈরি করে এবং পরিশেষে ইঞ্জিন তা রান করে।"}, {"id": 137, "topic": "Query Processing & Optimization", "question": "হিউরিস্টিক কুয়েরি অপটিমাইজেশনের (Heuristic Optimization) সবচেয়ে গুরুত্বপূর্ণ সোনালী নিয়ম কোনটি?", "options": ["ক) Selection ($\\sigma$) এবং Projection ($\\Pi$) অপারেশনগুলোকে এক্সপ্রেশন ট্রির যতদূর সম্ভব নিচের দিকে পুশ করা (Perform Selection/Projection Early)", "খ) কার্টেশিয়ান প্রোডাক্ট সবার আগে করা", "গ) সমস্ত জয়েন শেষে ফিল্টারিং করা", "ঘ) কোনো ইনডেক্স ব্যবহার না করা"], "answer": "ক", "explanation": "শুরুতেই Selection এবং Projection প্রয়োগ করলে মধ্যবর্তী রিলেশনের আকার (টাপল ও কলাম সংখ্যা) বহুলাংশে হ্রাস পায়, যার ফলে পরবর্তী ব্যয়বহুল জয়েন অপারেশনের খরচ নাটকীয়ভাবে কমে যায়।"}, {"id": 138, "topic": "Query Processing & Optimization", "question": "কুয়েরি অপটিমাইজার বিভিন্ন এক্সিকিউশন প্ল্যানের খরচ পরিমাপে মূলত কোন বিষয়টিকে প্রধান উপাদান হিসেবে বিবেচনা করে?", "options": ["ক) ইন্টারনেট ব্রাউজারের স্পিড", "খ) ডিস্ক ব্লক এক্সেসের সংখ্যা (Number of Disk Block I/O Operations)", "গ) কুয়েরির অক্ষরের দৈর্ঘ্য", "ঘ) ইউজারের পাসওয়ার্ড লেন্থ"], "answer": "খ", "explanation": "যেহেতু মেমরির তুলনায় সেকেন্ডারি স্টোরেজ (ডিস্ক) এক্সেস হাজার গুণ ধীর, তাই কুয়েরি অপটিমাইজেশন খরচের প্রধানতম মেট্রিক হলো মোট ডিস্ক ব্লক রিড/রাইট সংখ্যা।"}, {"id": 139, "topic": "Query Processing & Optimization", "question": "রিলেশন $R$ (যার ব্লক সংখ্যা $B_r$) এবং $S$ (যার ব্লক সংখ্যা $B_s$)। সাধারণ নেস্টেড-লুপ জয়েনে (Nested-Loop Join) সবচেয়ে খারাপ ক্ষেত্রে ডিস্ক ব্লক I/O খরচ কত?", "options": ["ক) $B_r + B_s$", "খ) $B_r + |R| \\times B_s$ (যেখানে $|R|$ হলো $R$-এর টাপল সংখ্যা)", "গ) $B_r \\times B_s$", "ঘ) $\\log (B_r + B_s)$"], "answer": "খ", "explanation": "সাধারণ টাপল-বেসড নেস্টেড লুপে আউটার রিলেশনের প্রতিটি সারির জন্য পুরো ইনার রিলেশন ডিস্ক থেকে পড়তে হয়, ফলে মোট খরচ দাঁড়ায় $B_r + |R| \\\\times B_s$।"}, {"id": 140, "topic": "Query Processing & Optimization", "question": "ব্লক নেস্টেড-লুপ জয়েনে (Block Nested-Loop Join) বাফার মেমরির সুবিধা নিয়ে ব্লক I/O খরচ কমিয়ে কত করা যায়?", "options": ["ক) $B_r + B_r \\times B_s$", "খ) $B_r + B_s$", "গ) $B_r + \\lceil B_r / (M - 2) \\rceil \\times B_s$ (যেখানে $M$ হলো বাফার ফ্রেম সংখ্যা)", "ঘ) $M \\times (B_r + B_s)$"], "answer": "গ", "explanation": "ব্লক নেস্টেড লুপে আউটার টেবিলের $M-2$ টি ব্লক একবারে মেমরিতে ক্যাশ করে ইনার টেবিলের সাথে মেলানো হয়, ফলে ইনার টেবিল স্ক্যান করার সংখ্যা বহুলাংশে কমে যায়।"}, {"id": 141, "topic": "Query Processing & Optimization", "question": "দুটি রিলেশন যদি তাদের জয়েন অ্যাট্রিবিউটের ওপর পূর্ব থেকেই সর্ট করা থাকে, তবে সবচেয়ে দ্রুততম জয়েন অ্যালগরিদম কোনটি?", "options": ["ক) Nested-Loop Join", "খ) Sort-Merge Join", "গ) Hash Join", "ঘ) Cartesian Join"], "answer": "খ", "explanation": "উভয় টেবিল যদি জয়েন কলামের ওপর সাজানো থাকে, তবে Sort-Merge Join প্রতিটি টেবিলকে একবার স্ক্যান করেই ($O(B_r + B_s)$ খরচে) সমস্ত মিল খুঁজে বের করতে পারে।"}, {"id": 142, "topic": "Query Processing & Optimization", "question": "অত্যন্ত বৃহৎ টেবিলের ক্ষেত্রে ন্যাচারাল বা ইকুই-জয়েন সম্পন্ন করতে আধুনিক RDBMS-এ কোন অ্যালগরিদমটি সর্বাধিক ব্যবহৃত হয়?", "options": ["ক) Grace Hash Join", "খ) Bubble Join", "গ) Linear Scan", "ঘ) Brute Force"], "answer": "ক", "explanation": "Hash Join (বিশেষ করে Grace Hash Join) উভয় টেবিলের জয়েন কি-র ওপর একই হ্যাশ ফাংশন চালিয়ে পার্টিশনে বিভক্ত করে এবং মেমরিতে বাকেট ধরে জয়েন করে অত্যন্ত দ্রুত ফলাফল দেয়।"}, {"id": 143, "topic": "Query Processing & Optimization", "question": "কুয়েরি কস্ট অনুমানে সিস্টেম ক্যাটালগ থেকে কোন পরিসংখ্যানগত তথ্য (Catalog Statistics) ব্যবহৃত হয়?", "options": ["ক) টাপলের মোট সংখ্যা ($n_r$), ব্লকের সংখ্যা ($b_r$), কলামের ডিস্ট্রিবিউশন ও ইউনিক মানের সংখ্যা ($V(A, r)$)", "খ) ইউজারের জন্মতারিখ", "গ) মনিটরের রেজোলিউশন", "ঘ) নেটওয়ার্ক ম্যাক অ্যাড্রেস"], "answer": "ক", "explanation": "অপটিমাইজার প্রতিটি অপারেশনের সিলেক্টিভিটি (Selectivity factor) হিসাব করতে ক্যাটালগে থাকা সাইজ, ডিস্ক ব্লক, স্বতন্ত্র মানের সংখ্যা এবং হিস্টোগ্রাম ব্যবহার করে।"}, {"id": 144, "topic": "Query Processing & Optimization", "question": "রিলেশনাল অ্যালজেবরায় জয়েন অপারেশনের কোন গাণিতিক বৈশিষ্ট্য কুয়েরি ট্রির পুনর্বিন্যাসে অপটিমাইজার ব্যবহার করে?", "options": ["ক) জয়েন অপারেশন Commutative এবং Associative উভয়ই ($R \\bowtie S = S \\bowtie R$ এবং $(R \\bowtie S) \\bowtie T = R \\bowtie (S \\bowtie T)$)", "খ) জয়েন অপারেশন শুধুমাত্র Distributive", "গ) জয়েন কখনো রিভার্স করা যায় না", "ঘ) জয়েন কেবল একটি টেবিলে হয়"], "answer": "ক", "explanation": "জয়েন বিনিময়যোগ্য (Commutative) এবং সংযোগী (Associative) হওয়ায় অপটিমাইজার টেবিলগুলোর জয়েন অর্ডার পরিবর্তন করে সবচেয়ে ছোট আকারের মধ্যবর্তী টেবিল আগে তৈরি করতে পারে।"}, {"id": 145, "topic": "Query Processing & Optimization", "question": "কুয়েরি অপটিমাইজারে 'Pipelining' বলতে কী বোঝায়?", "options": ["ক) ইন্টারমিডিয়েট ফলাফল ডিস্কে সংরক্ষণ না করে একটি অপারেশনের আউটপুট সরাসরি পরবর্তী অপারেশনে স্ট্রিম আকারে পাঠানো", "খ) সম্পূর্ণ টেবিল হার্ডডিস্কে ডাম্প করা", "গ) ফাইল কম্প্রেস করা", "ঘ) একাধিক কুয়েরি বাতিল করা"], "answer": "ক", "explanation": "Pipelining-এ অন্তর্বর্তী ফলাফল ডিস্কে না লিখে মেমরি পাইপের মধ্য দিয়ে সরাসরি পরবর্তী অপারেশনে পাঠানো হয়, যা ডিস্ক I/O এবং মেমরি ব্যবহার বাঁচায়।"}, {"id": 146, "topic": "Query Processing & Optimization", "question": "Materialization কৌশলের বৈশিষ্ট্য কোনটি?", "options": ["ক) কোনো মেমরি ব্যবহার করে না", "খ) অপারেশনের মধ্যবর্তী ফলাফলকে ডিস্কে একটি অস্থায়ী রিলেশন হিসেবে সম্পূর্ণরূপে তৈরি ও সংরক্ষণ করে পরবর্তী অপারেশনে ইনপুট দেওয়া হয়", "গ) এটি পাইপলাইনিংয়ের চেয়ে সর্বদাই দ্রুত", "ঘ) এটি কেবল সিলেকশনে চলে"], "answer": "খ", "explanation": "Materialization পদ্ধতিতে প্রতিটি সাব-অপারেশনের ফলাফল সম্পূর্ণরূপে একটি অস্থায়ী টেবিলে ডিস্কে তৈরি (Materialized) করা হয় এবং পরবর্তী অপারেটর তা রিড করে।"}, {"id": 147, "topic": "Query Processing & Optimization", "question": "একটি কলাম $A$-র ওপর সমতা শর্তে সিলেকশন $\\sigma_{A=v}(r)$ এর সিলেক্টিভিটি ফ্যাক্টর (Selectivity Factor) কত ধরা হয়, যদি মানের সুষম বণ্টন (Uniform distribution) থাকে?", "options": ["ক) $1 / V(A, r)$", "খ) $V(A, r) / n_r$", "গ) $n_r$", "ঘ) $1 / n_r^2$"], "answer": "ক", "explanation": "যদি কলামে $V(A, r)$ সংখ্যক স্বতন্ত্র মান থাকে এবং সেগুলো সমভাবে বণ্টিত থাকে, তবে যেকোনো একটি মানের জন্য ম্যাচ করার সম্ভাবনা বা সিলেক্টিভিটি হলো $1 / V(A, r)$।"}, {"id": 148, "topic": "Query Processing & Optimization", "question": "একটি SQL কুয়েরির এক্সিকিউশন প্ল্যান (Execution Plan) দেখার জন্য স্ট্যান্ডার্ড ডেটাবেজ কমান্ড কোনটি?", "options": ["ক) SHOW PLAN বা EXPLAIN SELECT ...", "খ) DEBUG QUERY", "গ) PRINT EXECUTION", "ঘ) LOG QUERY"], "answer": "ক", "explanation": "SQL-এ `EXPLAIN` বা `EXPLAIN ANALYZE` কমান্ড ব্যবহার করে অপটিমাইজারের নির্বাচিত এক্সিকিউশন প্ল্যান, ইনডেক্স স্ক্যান, জয়েন মেথড এবং কস্ট দেখা যায়।"}, {"id": 149, "topic": "Query Processing & Optimization", "question": "ইন্ডেক্স স্ক্যান (Index Scan) কখন ফুল টেবিল স্ক্যানের (Full Table Scan) চেয়ে ধীর হতে পারে?", "options": ["ক) যখন টেবিলটি অত্যন্ত ছোট হয় অথবা সিলেকশনে টেবিলের অধিকাংশ (> 20-30%) রো রিটার্ন করে", "খ) যখন টেবিলে কোনো প্রাইমারি কি থাকে না", "গ) যখন মেমরি অনেক বেশি থাকে", "ঘ) ইনডেক্স স্ক্যান কখনো ধীর হতে পারে না"], "answer": "ক", "explanation": "যদি কুয়েরিতে টেবিলের বিশাল অংশের রো প্রয়োজন হয়, তবে ইনডেক্স থেকে বারবার আন-ক্লাস্টার্ড ডেটা পেজে জাম্প করার চেয়ে সিকোয়েনশিয়াল ফুল টেবিল স্ক্যান অনেক দ্রুত হয়।"}, {"id": 150, "topic": "Query Processing & Optimization", "question": "ডাইনামিক প্রোগ্রামিং ভিত্তিক System-R অপটিমাইজেশন অ্যালগরিদমে কোন আকারের জয়েন ট্রি বিবেচনা করে স্পেস কমানো হয়?", "options": ["ক) Left-deep Join Tree", "খ) Bushy Tree", "গ) Right-deep Tree", "ঘ) Star Tree"], "answer": "ক", "explanation": "সিস্টেম-আর স্টাইলের অপটিমাইজার মূলত Left-deep Join Trees বিবেচনা করে, যার ফলে পাইপলাইনিং কার্যকর করা সহজ হয় এবং সার্চ স্পেস পরিমিত থাকে।"}, {"id": 151, "topic": "Transactions & Concurrency Control", "question": "ডেটাবেজ ট্রানজ্যাকশনের ACID প্রোপার্টিজ কোন চারটি বৈশিষ্ট্য নিয়ে গঠিত?", "options": ["ক) Accuracy, Consistency, Integrity, Durability", "খ) Atomicity, Consistency, Isolation, Durability", "গ) Authentication, Concurrency, Isolation, Distribution", "ঘ) Availability, Consistency, Isolation, Diversity"], "answer": "খ", "explanation": "ACID হলো ডেটাবেজ লেনদেনের মূল ভিত্তি: Atomicity (সব বা কিছুই না), Consistency (নিয়ম মেনে চলা), Isolation (পরস্পর বিচ্ছিন্নতা) এবং Durability (স্থায়িত্ব)।"}, {"id": 152, "topic": "Transactions & Concurrency Control", "question": "'একটি ট্রানজ্যাকশনের সমস্ত অপারেশন সফলভাবে সম্পন্ন হবে, নয়তো কোনো পরিবর্তনই ডেটাবেজে সংরক্ষিত হবে না (All or Nothing)'—এটি কোন বৈশিষ্ট্য?", "options": ["ক) Atomicity (পরমাণুতা)", "খ) Consistency", "গ) Isolation", "ঘ) Durability"], "answer": "ক", "explanation": "Atomicity নিশ্চিত করে ট্রানজ্যাকশনটি একটি অবিভাজ্য একক হিসেবে কাজ করে। মাঝপথে ফেইল করলে সম্পূর্ণ কাজ রোলব্যাক (Rollback/Abort) হয়ে আগের অবস্থায় ফিরে যায়।"}, {"id": 153, "topic": "Transactions & Concurrency Control", "question": "ট্রানজ্যাকশন সফলভাবে COMMIT হওয়ার পর সিস্টেম ক্র্যাশ করলেও তার ডেটা ডিস্কে সুরক্ষিত ও স্থায়ী থাকার নিশ্চয়তা কে দেয়?", "options": ["ক) Durability", "খ) Isolation", "গ) Atomicity", "ঘ) Availability"], "answer": "ক", "explanation": "Durability নিশ্চিত করে যে একবার ট্রানজ্যাকশন সফলভাবে কমিক হয়ে গেলে বিদ্যুৎ চলে গেলেও বা ওএস ক্র্যাশ করলেও ডেটা নষ্ট হবে না।"}, {"id": 154, "topic": "Transactions & Concurrency Control", "question": "ট্রানজ্যাকশনের লাইফসাইকেলে স্টেটগুলোর সঠিক ক্রম কোনটি?", "options": ["ক) Active -> Partially Committed -> Committed", "খ) Committed -> Active -> Failed", "গ) Failed -> Partially Committed -> Active", "ঘ) Aborted -> Committed -> Active"], "answer": "ক", "explanation": "ট্রানজ্যাকশন শুরু হলে Active স্টেটে থাকে, শেষ স্টেটমেন্টের পর Partially Committed হয়, এবং ডিস্কে লগ রাইট সফল হলে Committed স্টেটে পৌঁছায়। ব্যর্থ হলে Failed এবং পরে Aborted হয়।"}, {"id": 155, "topic": "Transactions & Concurrency Control", "question": "একটি ট্রানজ্যাকশন চলাকালীন অপর ট্রানজ্যাকশনের অসম্পূর্ণ/আনকমিটেড ডেটা রিড করার ফলে তৈরি হওয়া ত্রুটিকে কী বলে?", "options": ["ক) Lost Update Problem", "খ) Dirty Read Problem (বা Temporary Update)", "গ) Inconsistent Analysis", "ঘ) Phantom Read"], "answer": "খ", "explanation": "Dirty Read ঘটে যখন $T_1$ একটি ডেটা পরিবর্তন করে কিন্তু এখনো Commit করেনি, এবং সেই মুহূর্তে $T_2$ সেই মানটি রিড করে। পরে $T_1$ রোলব্যাক করলে $T_2$-র রিড করা ডেটা অবৈধ হয়ে যায়।"}, {"id": 156, "topic": "Transactions & Concurrency Control", "question": "দুটি অপারেশনের মধ্যে কনফ্লিক্ট (Conflict) হওয়ার শর্ত কোনটি?", "options": ["ক) অপারেশন দুটি ভিন্ন ট্রানজ্যাকশনের হতে হবে, একই ডেটা আইটেমের ওপর হতে হবে এবং অন্তত একটি অপারেশন WRITE হতে হবে", "খ) উভয় অপারেশন READ হতে হবে", "গ) দুটি ভিন্ন ডেটা আইটেমের হতে হবে", "ঘ) একই ট্রানজ্যাকশনের হতে হবে"], "answer": "ক", "explanation": "Read-Write ($R_1(A), W_2(A)$), Write-Read ($W_1(A), R_2(A)$) অথবা Write-Write ($W_1(A), W_2(A)$) কনফ্লিক্ট তৈরি করে যদি তারা ভিন্ন ট্রানজ্যাকশন কর্তৃক একই ডেটায় ঘটে।"}, {"id": 157, "topic": "Transactions & Concurrency Control", "question": "একটি শিডিউল কনফ্লিক্ট সিরিয়ালাইজেবল (Conflict Serializable) কিনা তা পরীক্ষা করার সবচেয়ে নির্ভরযোগ্য পদ্ধতি কোনটি?", "options": ["ক) বাবল সর্টিং", "খ) প্রেসিডেন্স গ্রাফ (Precedence Graph বা Conflict Graph)-এ কোনো সাইকেল (Cycle) আছে কিনা তা পরীক্ষা করা", "গ) ডেটাবেজ সাইজ মাপা", "ঘ) লক কাউন্ট করা"], "answer": "খ", "explanation": "Precedence Graph-এ প্রতিটি ট্রানজ্যাকশন একটি নোড এবং কনফ্লিক্টিং অপারেশনের জন্য এজ ($T_i \\to T_j$) টানা হয়। গ্রাফটি যদি Directed Acyclic Graph (DAG) হয় অর্থাৎ কোনো চক্র (Cycle) না থাকে, তবে শিডিউলটি Conflict Serializable।"}, {"id": 158, "topic": "Transactions & Concurrency Control", "question": "যে শিডিউল কনফ্লিক্ট সিরিয়ালাইজেবল নয়, কিন্তু কোনো ব্লাইন্ড রাইট (Blind Write) থাকার কারণে সিরিয়াল শিডিউলের সমতুল্য ফলাফল দেয় তাকে কী বলে?", "options": ["ক) View Serializable Schedule", "খ) Strict Schedule", "গ) Cascadeless Schedule", "ঘ) Recoverable Schedule"], "answer": "ক", "explanation": "View Serializability হলো সিরিয়ালাইজেবিলিটির একটি বিস্তৃত রূপ। প্রতিটি কনফ্লিক্ট সিরিয়ালাইজেবল শিডিউলই ভিউ সিরিয়ালাইজেবল, কিন্তু বিপরীতটি সর্বদা সত্য নয়।"}, {"id": 159, "topic": "Transactions & Concurrency Control", "question": "টু-ফেজ লকিং (2PL) প্রোটোকলের গ্রোয়িং ফেজ (Growing Phase) এবং শ্রিঙ্কিং ফেজ (Shrinking Phase)-এর নিয়ম কী?", "options": ["ক) গ্রোয়িং ফেজে কেবল লক অর্জন (Acquire) করা যায় কিন্তু কোনো লক ছাড়া যায় না, আর শ্রিঙ্কিং ফেজে লক রিলিজ করা যায় কিন্তু কোনো নতুন লক নেওয়া যায় না", "খ) যে কোনো সময় লক নেওয়া ও ছাড়া যায়", "গ) কোনো লক রিলিজ করা যায় না", "ঘ) ট্রানজ্যাকশন শুরুর আগেই সব লক ছাড়তে হয়"], "answer": "ক", "explanation": "2PL নিশ্চিত করে যে ট্রানজ্যাকশন একবার কোনো লক রিলিজ করা শুরু করলে (Shrinking phase) সে আর কখনো নতুন কোনো লক নিতে পারবে না। এটি Conflict Serializability নিশ্চিত করে।"}, {"id": 160, "topic": "Transactions & Concurrency Control", "question": "ক্যাসকেডিং অ্যাবোর্ট (Cascading Abort বা ক্যাসকেডিং রোলব্যাক) এড়াতে কোন ধরণের 2PL ব্যবহার করা হয়?", "options": ["ক) Basic 2PL", "খ) Strict 2PL (যেখানে সমস্ত Exclusive Lock ট্রানজ্যাকশন COMMIT বা ABORT না হওয়া পর্যন্ত ধরে রাখা হয়)", "গ) Dynamic 2PL", "ঘ) Optimistic 2PL"], "answer": "খ", "explanation": "Strict 2PL নিশ্চিত করে যে কোনো ট্রানজ্যাকশন তার সমস্ত এক্সক্লুসিভ লক শেষ না হওয়া (Commit/Abort) পর্যন্ত ধরে রাখবে, ফলে কেউ ডার্টি ডেটা রিড করতে পারে না এবং ক্যাসকেডিং রোলব্যাক বন্ধ হয়।"}, {"id": 161, "topic": "Transactions & Concurrency Control", "question": "রিগোরাস টু-ফেজ লকিং (Rigorous 2PL) এর ক্ষেত্রে কোনটি সত্য?", "options": ["ক) শুধুমাত্র Shared লক ধরে রাখা হয়", "খ) Shared (S) এবং Exclusive (X) উভয় ধরণের সমস্ত লকই ট্রানজ্যাকশন শেষ (Commit/Abort) না হওয়া পর্যন্ত ধরে রাখা হয়", "গ) কোনো লক নেওয়া হয় না", "ঘ) ডেডলক সম্পূর্ণ অসম্ভব"], "answer": "খ", "explanation": "Rigorous 2PL হলো সবচেয়ে কঠোর লকিং যেখানে ট্রানজ্যাকশনের সমাপ্তি পর্যন্ত সকল প্রকার (রিড ও রাইট) লক ধরে রাখা হয়, যা সিরিয়ালাইজেশন অর্ডারকে কমিট অর্ডারের সমান করে দেয়।"}, {"id": 162, "topic": "Transactions & Concurrency Control", "question": "লক-বেসড কনকারেন্সিতে ডেডলক প্রতিরোধের 'Wait-Die' স্কিমের নীতি কোনটি?", "options": ["ক) নন-প্রিম্পটিভ: যদি বয়স্ক ট্রানজ্যাকশন ($T_{old}$) কনিষ্ঠের ($T_{young}$) ধরে রাখা লক চায় তবে $T_{old}$ অপেক্ষা করবে (Wait); কিন্তু $T_{young}$ বয়স্কের লক চাইলে সে নিজে মরে যাবে/রোলব্যাক হবে (Die)", "খ) বয়স্ক ট্রানজ্যাকশন সবসময় তরুণকে হত্যা করবে", "গ) সবাই অনির্দিষ্টকাল অপেক্ষা করবে", "ঘ) কোনো ট্রানজ্যাকশন রোলব্যাক হবে না"], "answer": "ক", "explanation": "Wait-Die হলো নন-প্রিম্পটিভ টাইমস্ট্যাম্প স্কিম: $TS(T_i) < TS(T_j)$ হলে $T_i$ অপেক্ষা করতে পারে, কিন্তু বিপরীত হলে $T_i$ ডাই (অ্যাবোর্ট) হয়। এটি ডেডলক সাইকেল তৈরি হতে দেয় না।"}, {"id": 163, "topic": "Transactions & Concurrency Control", "question": "ডেডলক প্রতিরোধের 'Wound-Wait' স্কিম কোন ধরণের স্কিম?", "options": ["ক) প্রিম্পটিভ স্কিম (Preemptive Scheme): যেখানে বয়স্ক ট্রানজ্যাকশন কনিষ্ঠের কাছ থেকে জোরপূর্বক রিসোর্স ছিনিয়ে নিয়ে তাকে আহত বা বাতিল (Wound/Abort) করে", "খ) নন-প্রিম্পটিভ স্কিম", "গ) কোনো টাইমস্ট্যাম্প ব্যবহার করে না", "ঘ) র্যান্ডম রোলব্যাক স্কিম"], "answer": "ক", "explanation": "Wound-Wait প্রিম্পটিভ নীতি অনুসরণ করে: $TS(T_i) < TS(T_j)$ হলে $T_i$ তরুণ ট্রানজ্যাকশন $T_j$-কে উন্ড (অ্যাবোর্ট) করে রিসোর্স দখল করে, নয়তো অপেক্ষা করে।"}, {"id": 164, "topic": "Transactions & Concurrency Control", "question": "চলমান সিস্টেমে ডেডলক শনাক্ত করতে (Deadlock Detection) ডেটাবেজ সিস্টেম কোন গ্রাফ তৈরি ও পর্যবেক্ষণ করে?", "options": ["ক) B-Tree", "খ) Wait-For Graph (WFG)", "গ) Precedence Graph", "ঘ) Flowchart"], "answer": "খ", "explanation": "Wait-For Graph-এ এজ $T_i \\to T_j$ নির্দেশ করে যে ট্রানজ্যাকশন $T_i$ অন্য ট্রানজ্যাকশন $T_j$-র মুক্ত করার অপেক্ষায় রয়েছে। এই গ্রাফে চক্র (Cycle) তৈরি হলে ডেডলক নিশ্চিত হয়।"}, {"id": 165, "topic": "Transactions & Concurrency Control", "question": "টাইমস্ট্যাম্প-বেসড কনকারেন্সি প্রোটোকলে 'টমাস রাইট রুল' (Thomas' Write Rule) কোন সুবিধা প্রদান করে?", "options": ["ক) অপ্রয়োজনীয় ও পুরোনো রাইট অপারেশন উপেক্ষা (Ignore/Discard) করে অধিকতর কনকারেন্সি প্রদান করে", "খ) সমস্ত রিড অপারেশন বন্ধ করে দেয়", "গ) লক ছাড়া ডেটা ডিলিট করে", "ঘ) ক্যাসকেডিং অ্যাবোর্ট বৃদ্ধি করে"], "answer": "ক", "explanation": "টমাস রাইট রুলে যদি কোনো লেট রাইট আসে ($TS(T) < W\\_TS(Q)$), তবে ট্রানজ্যাকশনটি অ্যাবোর্ট না করে কেবল সেই পুরোনো রাইট অপারেশনটিকে বাতিল/উপেক্ষা করে এগিয়ে যায়।"}, {"id": 166, "topic": "Transactions & Concurrency Control", "question": "মাল্টিপল গ্র্যানুলারিটি লকিংয়ে (Multiple Granularity Locking) নিচের স্তরে লক নেওয়ার পূর্বে উপরের স্তরে কোন লক নিতে হয়?", "options": ["ক) Intention Lock (যেমন IS বা IX)", "খ) Exclusive Lock", "গ) Deadlock", "ঘ) Read Lock"], "answer": "ক", "explanation": "হায়ারার্কির নোডে সরাসরি লক না নিয়ে তার পূর্বপুরুষ (Ancestor) নোডগুলোতে ইনটেনশন লক (Intent Shared - IS বা Intent Exclusive - IX) স্থাপন করে নিচের স্তরে লকিং সহজ করা হয়।"}, {"id": 167, "topic": "Transactions & Concurrency Control", "question": "অপটিমিস্টিক কনকারেন্সি কন্ট্রোলে (Optimistic Concurrency Control) তিনটি ধাপ কী কী?", "options": ["ক) Lock Phase -> Execute Phase -> Free Phase", "খ) Read Phase -> Validation Phase -> Write Phase", "গ) Start Phase -> Sleep Phase -> Commit Phase", "ঘ) Write Phase -> Read Phase -> Log Phase"], "answer": "খ", "explanation": "অপটিমিস্টিক কন্ট্রোলে ধরে নেওয়া হয় সংঘাত কম হবে। প্রথমে রিড করে লোকাল ভেরিয়েবলে কাজ হয় (Read Phase), তারপর কোনো সংঘাত হয়েছে কিনা যাচাই করা হয় (Validation Phase), এবং সবশেষে ডেটাবেজে লেখা হয় (Write Phase)।"}, {"id": 168, "topic": "Transactions & Concurrency Control", "question": "SQL ট্রানজ্যাকশনের সর্বোচ্চ আইসোলেশন লেভেল (Highest Isolation Level) কোনটি?", "options": ["ক) READ UNCOMMITTED", "খ) READ COMMITTED", "গ) REPEATABLE READ", "ঘ) SERIALIZABLE"], "answer": "ঘ", "explanation": "SERIALIZABLE হলো সর্বোচ্চ আইসোলেশন লেভেল যা Dirty Read, Non-repeatable Read এবং Phantom Read—সকল ত্রুটি সম্পূর্ণরূপে দূর করে সমান্তরাল কাজকে ধারাবাহিক রূপ দেয়।"}, {"id": 169, "topic": "Transactions & Concurrency Control", "question": "একই ট্রানজ্যাকশনে একই কুয়েরি দুইবার চালালে দ্বিতীয়বারে অন্য ট্রানজ্যাকশন কর্তৃক ইনসার্ট করা নতুন সারির উপস্থিতি পাওয়ার সমস্যাকে কী বলে?", "options": ["ক) Dirty Read", "খ) Phantom Read", "গ) Lost Update", "ঘ) Starvation"], "answer": "খ", "explanation": "Phantom Read ঘটে যখন রেঞ্জ কুয়েরির মাঝে অন্য কেউ নতুন রো INSERT করে এবং আগের ট্রানজ্যাকশন একই শর্তে পুনরায় কুয়েরি চালিয়ে 'ভৌতিক' নতুন রেকর্ড দেখতে পায়।"}, {"id": 170, "topic": "Transactions & Concurrency Control", "question": "ডেডলক রিকভারির সময় যে ট্রানজ্যাকশনকে বাতিল বা রোলব্যাক করার জন্য বাছাই করা হয় তাকে কী বলা হয়?", "options": ["ক) Coordinator", "খ) Victim Transaction (শিকার ট্রানজ্যাকশন)", "গ) Orphan Transaction", "ঘ) Zombie Transaction"], "answer": "খ", "explanation": "ডেডলক ভাঙতে সাইকেল থেকে ন্যূনতম খরচের কোনো একটি ট্রানজ্যাকশনকে 'Victim' হিসেবে নির্বাচন করে রোলব্যাক করা হয় এবং তার রিসোর্স মুক্ত করা হয়।"}, {"id": 171, "topic": "Recovery System", "question": "Write-Ahead Logging (WAL) প্রোটোকলের প্রধান নিয়ম কোনটি?", "options": ["ক) ডেটাবেজ বাফার থেকে মূল ডেটা পেজ ডিস্কে লেখার আগেই সংশ্লিষ্ট লগ রেকর্ডটি স্থায়ী ডিস্কে রাইট হতে হবে", "খ) লগ সবশেষে লেখা হবে", "গ) কোনো লগ রাখা যাবে না", "ঘ) লগ কেবল মেমরিতে থাকবে"], "answer": "ক", "explanation": "WAL নিশ্চিত করে যে ডেটাবেজের কোনো ডিস্ক পরিবর্তন স্থায়ী হওয়ার আগে অবশ্যই তার Undo/Redo লগ রেকর্ড নন-ভোলাটাইল ডিস্ক স্টোরেজে লেখা সম্পন্ন হতে হবে।"}, {"id": 172, "topic": "Recovery System", "question": "ডিফার্ড ডেটাবেজ মডিফিকেশন (Deferred Database Modification) কৌশলে ক্র্যাশের পর রিকভারি করতে কোনটি প্রয়োজন হয় না?", "options": ["ক) UNDO অপারেশনের প্রয়োজন হয় না, কেবল REDO প্রয়োজন হয়", "খ) REDO প্রয়োজন হয় না", "গ) কোনো লগ রেকর্ড প্রয়োজন হয় না", "ঘ) চেকপয়েন্ট লাগে না"], "answer": "ক", "explanation": "Deferred Modification-এ ট্রানজ্যাকশন সম্পূর্ণরূপে Commit না হওয়া পর্যন্ত মূল ডেটাবেজ ফাইলে কোনো রাইট হয় না, ফলে ক্র্যাশ করলে কখনো UNDO করার দরকার পড়ে না।"}, {"id": 173, "topic": "Recovery System", "question": "ইমিডিয়েট ডেটাবেজ মডিফিকেশন (Immediate Database Modification) কৌশলে সিস্টেম রিকভারির জন্য কোন দুটি অপারেশন প্রয়োজন?", "options": ["ক) কেবল REDO", "খ) UNDO এবং REDO উভয়ই", "গ) কেবল Rollback", "ঘ) Commit এবং Terminate"], "answer": "খ", "explanation": "Immediate Modification-এ ট্রানজ্যাকশন চলাকালীনই ডিস্কে পরিবর্তন লেখা হতে পারে, তাই আনকমিটেড ট্রানজ্যাকশনকে UNDO এবং কমিটেড ট্রানজ্যাকশনকে REDO করতে হয়।"}, {"id": 174, "topic": "Recovery System", "question": "ডেটাবেজ রিকভারিতে 'চেকপয়েন্ট' (Checkpoint)-এর প্রধান সুবিধা কী?", "options": ["ক) এটি পুরো লগ ফাইলের শুরু থেকে স্ক্যান করার প্রয়োজনীয়তা দূর করে রিকভারির সময় বহুগুণ কমিয়ে আনে", "খ) এটি সকল পাসওয়ার্ড মুছে দেয়", "গ) এটি ডিস্কের সাইজ বাড়িয়ে দেয়", "ঘ) এটি টেবিল ড্রপ করে"], "answer": "ক", "explanation": "চেকপয়েন্টের সময় সমস্ত মডিফায়েড মেমরি পেজ ফিজিক্যাল ডিস্কে জোরপূর্বক ফ্লাশ করে নিশ্চিত করা হয়। ফলে ক্র্যাশ রিকভারির সময় চেকপয়েন্টের পূর্ববর্তী সফল লেনদেনগুলোকে আর রিডো করতে হয় না।"}, {"id": 175, "topic": "Recovery System", "question": "আইবিএম কর্তৃক উদ্ভাবিত আধুনিক ডেটাবেজ রিকভারি অ্যালগরিদম ARIES-এর তিনটি পর্যায় কোনগুলো?", "options": ["ক) Scan, Sort, Merge", "খ) Analysis Phase, Redo Phase (Repeating history), Undo Phase", "গ) Lock, Execute, Unlock", "ঘ) Read, Write, Commit"], "answer": "খ", "explanation": "ARIES তিনটি ধাপে কাজ করে: Analysis (সিস্টেমের অবস্থা বিশ্লেষণ), Redo (ক্র্যাশের আগ পর্যন্ত সমস্ত হিস্ট্রি রিপিট করা), এবং Undo (অসম্পূর্ণ ট্রানজ্যাকশন রোলব্যাক করা)।"}, {"id": 176, "topic": "Recovery System", "question": "শ্যাডো পেজিং (Shadow Paging) রিকভারি টেকনিকে ডেটাবেজ ডিরেক্টরির কয়টি কপি রাখা হয়?", "options": ["ক) ১টি", "খ) ২টি (Current Page Table এবং Shadow Page Table)", "গ) ৩টি", "ঘ) ৪টি"], "answer": "খ", "explanation": "Shadow Paging-এ দুটি পেজ টেবিল থাকে। ট্রানজ্যাকশন চলাকালীন সমস্ত পরিবর্তন Current Page Table-এ হয় এবং ক্র্যাশ হলে কোনো লগ ছাড়াই Shadow Page Table পুনরুদ্ধার করে রোলব্যাক করা যায়।"}, {"id": 177, "topic": "Recovery System", "question": "কম্পিউটার বিজ্ঞানে এমন স্টোরেজ যা কোনো অবস্থাতেই ডেটা হারায় না (তাত্ত্বিকভাবে শতভাগ নির্ভরযোগ্য) তাকে কী বলে?", "options": ["ক) Volatile Storage", "খ) Non-volatile Storage", "গ) Stable Storage", "ঘ) Optical Storage"], "answer": "গ", "explanation": "Stable Storage হলো একাধিক নন-ভোলাটাইল মিডিয়াতে (যেমন মিরর ডিস্ক/RAID) প্রতিলিপি তৈরি করে নির্মিত ধারণাগত স্টোরেজ যা সকল ফেইলিওর সত্ত্বেও ডেটা অক্ষত রাখে।"}, {"id": 178, "topic": "Recovery System", "question": "লগ ফাইলে ট্রানজ্যাকশন $T_i$ এর জন্য $\\langle T_i, \\text{start} \\rangle$ আছে কিন্তু কোনো $\\langle T_i, \\text{commit} \\rangle$ বা $\\langle T_i, \\text{abort} \\rangle$ নেই। ক্র্যাশের পর রিকভারি ম্যানেজার কী করবে?", "options": ["ক) ট্রানজ্যাকশনটিকে REDO করবে", "খ) ট্রানজ্যাকশনটিকে UNDO (রোলব্যাক) করবে", "গ) ট্রানজ্যাকশনটিকে Commit ঘোষণা করবে", "ঘ) কিছুই করবে না"], "answer": "খ", "explanation": "যেসব ট্রানজ্যাকশন ক্র্যাশের আগ পর্যন্ত কমিট হতে পারেনি তাদের সম্পূর্ণ কাজ UNDO করে ডেটাবেজকে আবার সামঞ্জস্যপূর্ণ অবস্থায় নিয়ে আসা হয়।"}, {"id": 179, "topic": "Recovery System", "question": "লগ ফাইলে প্রতিটি লগ রেকর্ডের একটি অনন্য ক্রমবর্ধমান শনাক্তকারী সংখ্যা থাকে, যাকে কী বলা হয়?", "options": ["ক) Log Sequence Number (LSN)", "খ) Transaction ID", "গ) Block Number", "ঘ) Sector Key"], "answer": "ক", "explanation": "প্রতিটি লগ এন্ট্রিকে LSN (Log Sequence Number) দিয়ে চিহ্নিত করা হয়। প্রতিটি ডেটা পেজেও তার সর্বশেষ আপডেটের PageLSN লেখা থাকে যা রিকভারিতে ব্যবহৃত হয়।"}, {"id": 180, "topic": "Recovery System", "question": "রোলব্যাক করার সময় লগ ফাইলে ক্ষতিপূরণমূলক যে বিশেষ লগ রেকর্ড লেখা হয় তাকে কী বলে?", "options": ["ক) Checkpoint Record", "খ) Compensation Log Record (CLR)", "গ) Abort Signal", "ঘ) Redo Token"], "answer": "খ", "explanation": "ARIES অ্যালগরিদমে UNDO চলাকালীন প্রতিটি বিপরীত পরিবর্তনের জন্য Compensation Log Record (CLR) লেখা হয় যেন রিকভারি চলাকালীন পুনরায় ক্র্যাশ হলেও ইনফিনিট লুপ না ঘটে।"}, {"id": 181, "topic": "Data Mining & Data Warehousing", "question": "OLTP (Online Transaction Processing) এবং OLAP (Online Analytical Processing)-এর মধ্যে মূল পার্থক্য কোনটি?", "options": ["ক) OLTP দৈনন্দিন ট্রানজ্যাকশন ও দ্রুত ইনসার্ট/আপডেটের জন্য অপটিমাইজড, আর OLAP ঐতিহাসিক ডেটা বিশ্লেষণ ও জটিল ব্যবসায়িক রিপোর্টিংয়ের জন্য অপটিমাইজড", "খ) OLAP কোনো কুয়েরি সাপোর্ট করে না", "গ) OLTP কেবলমাত্র ডেটা ওয়্যারহাউজে চলে", "ঘ) এদের মধ্যে কোনো পার্থক্য নেই"], "answer": "ক", "explanation": "OLTP পরিচালিত হয় রিয়েল-টাইম অপারেশনাল কাজের জন্য (3NF নরমালাইজড), আর OLAP পরিচালিত হয় ডিসিশন সাপোর্ট ও ব্যবসায়িক বুদ্ধিমত্তার (BI) জন্য (ডিনরমালাইজড স্টার স্কিমা)।"}, {"id": 182, "topic": "Data Mining & Data Warehousing", "question": "ডেটা ওয়্যারহাউজের কোন স্কিমাতে একটি সেন্ট্রাল ফ্যাক্ট টেবিল (Fact Table) সরাসরি একাধিক ডিমেনশন টেবিলের (Dimension Tables) সাথে যুক্ত থাকে?", "options": ["ক) Snowflake Schema", "খ) Star Schema (তারকা স্কিমা)", "গ) Fact Constellation", "ঘ) Network Schema"], "answer": "খ", "explanation": "Star Schema হলো ডেটা ওয়্যারহাউজের সবচেয়ে সহজ ও জনপ্রিয় মডেল যেখানে কেন্দ্রে একটি ফ্যাক্ট টেবিল থাকে এবং তার চারপাশে অ-নরমালাইজড ডিমেনশন টেবিলগুলো তারার মতো বিন্যস্ত থাকে।"}, {"id": 183, "topic": "Data Mining & Data Warehousing", "question": "Snowflake Schema কীভাবে Star Schema থেকে আলাদা?", "options": ["ক) Snowflake স্কিমাতে ডিমেনশন টেবিলগুলোকে আরও নরমালাইজড করে একাধিক উপ-টেবিলে বিভক্ত করা হয়", "খ) Snowflake স্কিমাতে কোনো ফ্যাক্ট টেবিল থাকে না", "গ) Snowflake স্কিমাতে কোনো জয়েন করা যায় না", "ঘ) এটি স্টার স্কিমার চেয়ে সহজ"], "answer": "ক", "explanation": "স্নোফ্লেক স্কিমাতে রিডান্ড্যান্সি কমাতে ডিমেনশন টেবিলগুলোকে নরমালাইজ করে আরও শাখা-প্রশাখায় ভাগ করা হয় যা দেখতে স্নো-ফ্লেকের মতো দেখায়।"}, {"id": 184, "topic": "Data Mining & Data Warehousing", "question": "OLAP অপারেশনে সামগ্রিক ডেটা থেকে ক্রমান্বয়ে গভীর বিস্তারিত তথ্যের দিকে যাওয়ার (যেমন: বছর -> মাস -> দিন) প্রক্রিয়াকে কী বলে?", "options": ["ক) Roll-up (বা Drill-up)", "খ) Drill-down", "গ) Slice and Dice", "ঘ) Pivot"], "answer": "খ", "explanation": "Drill-down কম বিস্তারিত থেকে অধিকতর বিস্তারিত তথ্যের গভীরে প্রবেশ করায়। এর বিপরীত হলো Roll-up (যা ডেটাকে এগ্রিগেট করে সংক্ষেপ করে)।"}, {"id": 185, "topic": "Data Mining & Data Warehousing", "question": "ডিসিশন ট্রি ক্লাসিফিকেশনের (Decision Tree) ID3 অ্যালগরিদমে সেরা স্প্লিটিং অ্যাট্রিবিউট বাছাই করতে কোনটি পরিমাপ করা হয়?", "options": ["ক) Euclidean Distance", "খ) Information Gain এবং Entropy (এনট্রপি)", "গ) Gini Impurity", "ঘ) Support and Confidence"], "answer": "খ", "explanation": "ID3 অ্যালগরিদম প্রতিটি অ্যাট্রিবিউটের এনট্রপি পরিবর্তনের মাধ্যমে Information Gain হিসাব করে এবং যে অ্যাট্রিবিউটে ইনফরমেশন গেইন সর্বোচ্চ হয় তাকে নোড হিসেবে স্প্লিট করে।"}, {"id": 186, "topic": "Data Mining & Data Warehousing", "question": "CART (Classification and Regression Trees) অ্যালগরিদম নোড স্প্লিট করার জন্য কোন মেট্রিকটি ব্যবহার করে?", "options": ["ক) Information Gain", "খ) Gini Index / Gini Impurity", "গ) Silhouette Score", "ঘ) Cosine Similarity"], "answer": "খ", "explanation": "CART অ্যালগরিদমে ডেটাসেটের অবিশুদ্ধতা পরিমাপ করতে Gini Index ব্যবহার করা হয়। জিনি ইনডেক্স যত কম হয়, স্প্লিট তত নিখুঁত হয়।"}, {"id": 187, "topic": "Data Mining & Data Warehousing", "question": "নেভ বায়েস ক্লাসিফায়ার (Naive Bayes Classifier) কোন মৌলিক অনুমানের ওপর ভিত্তি করে কাজ করে?", "options": ["ক) সমস্ত ফিচার একে অপরের সাথে গভীরভাবে যুক্ত", "খ) ক্লাসের প্রেক্ষিতে সকল ফিচার পরস্পরের থেকে সম্পূর্ণ স্বাধীন (Conditional Independence)", "গ) কোনো প্রোবাবিলিটি ব্যবহার করে না", "ঘ) ডেটাসেট অবশ্যই লিনিয়ার হতে হবে"], "answer": "খ", "explanation": "বায়েস থিওরেম প্রয়োগের সুবিধার জন্য এটি ধরে নেয় যে একটি ফিচারের উপস্থিতি অন্য ফিচারের থেকে স্বাধীন, এই সরলীকরণের জন্যই একে 'Naive' বলা হয়।"}, {"id": 188, "topic": "Data Mining & Data Warehousing", "question": "অ্যাসোসিয়েশন রুল মাইনিংয়ে (Association Rule Mining, যেমন মার্কেট বাস্কেট এনালাইসিস) কোন দুটি প্রধান মেট্রিক ব্যবহৃত হয়?", "options": ["ক) Precision এবং Recall", "খ) Support এবং Confidence", "গ) Entropy এবং Variance", "ঘ) Mean এবং Median"], "answer": "খ", "explanation": "একটি রুল $X \\to Y$ কতটা জনপ্রিয় তা মাপে Support (মোট ট্রানজ্যাকশনে $X$ ও $Y$ একসাথে থাকার অনুপাত) এবং কতটা নির্ভরযোগ্য তা মাপে Confidence ($X$ ঘটলে $Y$ ঘটার সম্ভাবনা)।"}, {"id": 189, "topic": "Data Mining & Data Warehousing", "question": "ফ্রিকোয়েন্ট আইটেমসেট (Frequent Itemset) খোঁজার জন্য বহুল ব্যবহৃত প্রুনিং অ্যালগরিদম কোনটি?", "options": ["ক) Apriori Algorithm", "খ) Dijkstra Algorithm", "গ) Kruskal Algorithm", "ঘ) Round Robin"], "answer": "ক", "explanation": "Apriori অ্যালগরিদম এই নীতির ওপর চলে যে: 'যদি কোনো আইটেমসেট ফ্রিকোয়েন্ট হয়, তবে তার সমস্ত সাবসেটও অবশ্যই ফ্রিকোয়েন্ট হবে।' এর ফলে অপ্রয়োজনীয় কম্বিনেশন প্রুন করা সম্ভব হয়।"}, {"id": 190, "topic": "Data Mining & Data Warehousing", "question": "K-Means অ্যালগরিদম ডেটা মাইনিংয়ের কোন প্রধান শাখার অন্তর্ভুক্ত?", "options": ["ক) সুপারভাইজড ক্লাসিফিকেশন", "খ) আন-সুপারভাইজড ক্লাস্টারিং (Unsupervised Clustering)", "গ) রিগ্রেশন মডেলিং", "ঘ) সিকোয়েন্স প্রেডিকশন"], "answer": "খ", "explanation": "K-Means কোনো পূর্ব-নির্ধারিত লেবেল ছাড়াই দূরত্বের (Centroid distance) ওপর ভিত্তি করে ডেটাকে স্বয়ংক্রিয়ভাবে $K$-টি ক্লাস্টারে ভাগ করে, যা একটি আন-সুপারভাইজড পদ্ধতি।"}, {"id": 191, "topic": "Parallel and Distributed Databases & Security", "question": "প্যারালাল ডেটাবেজ আর্কিটেকচারে কোন মডেলটি সবচেয়ে বেশি স্কেলেবল (Scalable) এবং ফল্ট-টলারেন্ট?", "options": ["ক) Shared Memory", "খ) Shared Disk", "গ) Shared Nothing Architecture", "ঘ) Shared Cache"], "answer": "গ", "explanation": "Shared-Nothing আর্কিটেকচারে প্রতিটি নোডের নিজস্ব প্রসেসর, মেমরি ও ডিস্ক থাকে এবং নোডগুলো উচ্চগতির নেটওয়ার্কে যুক্ত থাকে। ফলে এতে কোনো সেন্ট্রাল বটলনেক থাকে না এবং এটি সবচেয়ে স্কেলেবল।"}, {"id": 192, "topic": "Parallel and Distributed Databases & Security", "question": "প্যারালাল ডেটাবেজে রাউন্ড-রবিন পার্টিশনিংয়ের (Round-robin partitioning) নিয়ম কী?", "options": ["ক) প্রতিটি টাপলকে পর্যায়ক্রমে ক্রমানুসারে পরবর্তী ডিস্কে পাঠিয়ে সকল ডিস্কে সমানভাবে ডেটা বণ্টন করা", "খ) হ্যাশ ফাংশন দিয়ে ডিস্ক নির্ধারণ করা", "গ) একটি নির্দিষ্ট রেঞ্জ দেখে ডিস্কে পাঠানো", "ঘ) সমস্ত ডেটা কেবল প্রথম ডিস্কে রাখা"], "answer": "ক", "explanation": "রাউন্ড-রবিনে টাপলগুলোকে চক্রাকারে $D_0, D_1, D_2, \\dots$ ডিস্কে বণ্টন করা হয় যা সব ডিস্কে সমান আকারের ডেটা বিস্তার নিশ্চিত করে।"}, {"id": 193, "topic": "Parallel and Distributed Databases & Security", "question": "একটি টেবিলের কিছু নির্দিষ্ট সারি (Rows) এক সাইটে এবং বাকি সারি অন্য সাইটে সংরক্ষণ করাকে কোন ধরণের ফ্র্যাগমেন্টেশন বলে?", "options": ["ক) Vertical Fragmentation", "খ) Horizontal Fragmentation (অনুভূমিক খণ্ডায়ন)", "গ) Mixed Fragmentation", "ঘ) Derived Fragmentation"], "answer": "খ", "explanation": "Selection ($\\\\sigma$) অপারেশনের মাধ্যমে টেবিলের অনুভূমিক সারিগুলোকে বিভিন্ন সাইটে ভাগ করাকে Horizontal Fragmentation বলে। কলামগুলোকে ভাগ করলে Vertical Fragmentation হয়।"}, {"id": 194, "topic": "Parallel and Distributed Databases & Security", "question": "ডিস্ট্রিবিউটেড ডেটাবেজে পরমাণুতা (Atomicity) নিশ্চিত করার স্ট্যান্ডার্ড প্রোটোকল কোনটি?", "options": ["ক) Two-Phase Commit Protocol (2PC)", "খ) Sliding Window Protocol", "গ) Two-Phase Locking", "ঘ) Stop and Wait"], "answer": "ক", "explanation": "2PC প্রোটোকলে কো-অর্ডিনেটর প্রথমে সমস্ত সাইটকে প্রস্তুতির জন্য ভোট পাঠায় (Prepare Phase) এবং সকল সাইট রাজি হলে ফাইনাল কমিট পাঠায় (Commit Phase), নয়তো বাতিল করে।"}, {"id": 195, "topic": "Parallel and Distributed Databases & Security", "question": "ডিস্ট্রিবিউটেড সিস্টেমের CAP থিওরেম অনুযায়ী কোন তিনটি বৈশিষ্ট্যের মধ্যে সর্বোচ্চ দুটি একসাথে পূর্ণ অর্জন করা সম্ভব?", "options": ["ক) Consistency, Availability, Partition Tolerance", "খ) Concurrency, Accuracy, Performance", "গ) Confidentiality, Authentication, Privacy", "ঘ) Capacity, Adaptability, Persistence"], "answer": "ক", "explanation": "এরিক ব্রিউয়ারের CAP উপপাদ্য অনুযায়ী নেটওয়ার্ক পার্টিশনের ($P$) উপস্থিতিতে একটি ডিস্ট্রিবিউটেড সিস্টেম একই সাথে Consistency ($C$) এবং Availability ($A$) উভয়টি অর্জন করতে পারে না।"}, {"id": 196, "topic": "Parallel and Distributed Databases & Security", "question": "ডেটাবেজ সিকিউরিটিতে Discretionary Access Control (DAC) কীভাবে প্রয়োগ করা হয়?", "options": ["ক) ওএস কার্নেল লেভেলে", "খ) SQL এর GRANT এবং REVOKE স্টেটমেন্টের মাধ্যমে ব্যবহারকারীদের সুযোগ ও পারমিশন নির্ধারণ করে", "গ) শুধুমাত্র ফায়ারওয়াল দিয়ে", "ঘ) ব্যবহারকারীর আইপি ব্লক করে"], "answer": "খ", "explanation": "DAC মডেলে ডেটার মালিক নিজেই সিদ্ধান্ত নেন কে কোন টেবিল বা কলাম পড়তে বা লিখতে পারবে, যা SQL-এ `GRANT` এবং `REVOKE` কমান্ড দ্বারা পরিচালিত হয়।"}, {"id": 197, "topic": "Parallel and Distributed Databases & Security", "question": "Mandatory Access Control (MAC) মডেলে ডেটা এক্সেস নিয়ন্ত্রণের ভিত্তি কী?", "options": ["ক) ইউজারের ক্লিয়ারেন্স লেভেল এবং ডেটা অবজেক্টের সিকিউরিটি ক্লাসিফিকেশন লেভেল (যেমন: Top Secret, Secret, Confidential)", "খ) টেবিলের আকার", "গ) ইনডেক্সের সংখ্যা", "ঘ) ফাইল ফরম্যাট"], "answer": "ক", "explanation": "MAC মডেলে সিস্টেম সেন্ট্রালি কঠোর নীতি প্রয়োগ করে। Bell-LaPadula মডেল (No Read-Up, No Write-Down) অনুযায়ী নিরাপত্তা স্তর যাচাই করে ডেটা প্রবেশাধিকার দেওয়া হয়।"}, {"id": 198, "topic": "Parallel and Distributed Databases & Security", "question": "Role-Based Access Control (RBAC)-এর মূল ধারণা কোনটি?", "options": ["ক) প্রতিটি ব্যবহারকারীকে সরাসরি আলাদা আলাদা শত শত অনুমতি দেওয়া", "খ) অনুমতি বা পারমিশনগুলোকে নির্দিষ্ট রোলে (যেমন: Admin, Manager, Cashier) অর্পণ করা এবং ব্যবহারকারীদের সেই রোলে যুক্ত করা", "গ) কোনো পাসওয়ার্ড না রাখা", "ঘ) কেবল রুট ইউজার দিয়ে কাজ করা"], "answer": "খ", "explanation": "RBAC-এ অনুমতি দেওয়া হয় পদের বা রোলের (Role) ভিত্তিতে, যা বৃহৎ প্রতিষ্ঠানে ব্যবহারকারী অধিকার ব্যবস্থাপনা অত্যন্ত সহজ ও সুসংহত করে তোলে।"}, {"id": 199, "topic": "Parallel and Distributed Databases & Security", "question": "SQL Injection প্রতিরোধে অ্যাপ্লিকেশনে ইনপুট ডেটা যাচাই করার পাশাপাশি কোন কৌশলটি বাধ্যতামূলক?", "options": ["ক) Parameterized Queries বা PreparedStatement ব্যবহার করা", "খ) কন্টেইনারে ডেটা রাখা", "গ) ডেটাবেজ সাইট বন্ধ রাখা", "ঘ) কেবল GET রিকোয়েস্ট ব্যবহার করা"], "answer": "ক", "explanation": "প্যারামিটারাইজড কুয়েরিতে ইউজার ইনপুটকে সরাসরি কুয়েরি কোডের সাথে জোড়া না লাগিয়ে আলাদা প্যারামিটার হিসেবে ডেটাবেজে পাঠানো হয়, ফলে ইনপুট কোনো নির্দেশ হিসেবে রান করার সুযোগ পায় না।"}, {"id": 200, "topic": "Parallel and Distributed Databases & Security", "question": "ডেটাবেজ টিউনিংয়ের (Database Performance Tuning) সবচেয়ে সাধারণ ও কার্যকর প্রাথমিক পদক্ষেপ কোনটি?", "options": ["ক) ঘন ঘন ব্যবহৃত WHERE এবং JOIN কলামের ওপর যথাযথ ইনডেক্স তৈরি করা এবং ধীরগতির কুয়েরিগুলোর এক্সিকিউশন প্ল্যান বিশ্লেষণ করা", "খ) সমস্ত টেবিল মুছে ফেলা", "গ) সকল ফরেন কি তুলে দেওয়া", "ঘ) হার্ডডিস্ক বদলে ফেলা"], "answer": "ক", "explanation": "পারফরম্যান্স টিউনিংয়ের শুরুতেই স্লো কুয়েরি লগ ও এক্সিকিউশন প্ল্যান (EXPLAIN) দেখে অপ্রয়োজনীয় ফুল টেবিল স্ক্যান বাদ দিয়ে সঠিক ক্লাস্টার্ড/সেকেন্ডারি ইনডেক্স তৈরি করা হয়।"}]}, {"id": "ch7", "title": "অধ্যায়- ৭. Data Communications and Networking", "short": "৭. Networking", "count": 200, "questions": [{"id": 1, "topic": "Network Edge, Core & Protocol Layers", "question": "কম্পিউটার নেটওয়ার্কে এন্ড সিস্টেম (End Systems) বা হোস্ট (Hosts) কোনগুলো?", "options": ["ক) রাউটার ও সুইচ", "খ) কম্পিউটার, স্মার্টফোন, সার্ভার ও আইওটি ডিভাইস", "গ) ফাইবার অপটিক ক্যাবল ও রিপিটার", "ঘ) কেবল ডিএনএস সার্ভার"], "answer": "খ", "explanation": "নেটওয়ার্কের প্রান্তে (Network Edge) সংযুক্ত যেসকল ডিভাইসে ব্যবহারকারীর অ্যাপ্লিকেশন সফটওয়্যার রান করে (যেমন পিসি, সার্ভার, মোবাইল) সেগুলোকে End Systems বা Hosts বলা হয়।"}, {"id": 2, "topic": "Network Edge, Core & Protocol Layers", "question": "প্যাকেট সুইচিং (Packet Switching) এবং সার্কিট সুইচিং (Circuit Switching)-এর মধ্যে মূল পার্থক্য কোনটি?", "options": ["ক) সার্কিট সুইচিংয়ে যোগাযোগের পূর্বে একটি ডেডিকেটেড ফিজিক্যাল পাথ বা ব্যান্ডউইথ রিজার্ভ করা হয়, আর প্যাকেট সুইচিংয়ে কোনো ডেডিকেটেড পাথ ছাড়াই প্যাকেটগুলো স্বাধীনভাবে রাউট হয়", "খ) প্যাকেট সুইচিং শুধুমাত্র অ্যানালগ সিগন্যালে চলে", "গ) সার্কিট সুইচিংয়ে কোনো সংযোগ স্থাপন করতে হয় না", "ঘ) ইন্টারনেট সার্কিট সুইচিং ব্যবহার করে"], "answer": "ক", "explanation": "ঐতিহ্যবাহী টেলিফোন নেটওয়ার্কে Circuit Switching ব্যবহৃত হতো যেখানে সম্পূর্ণ চ্যানেল সংরক্ষিত থাকে। বিপরীতে ইন্টারনেট Packet Switching (Store-and-Forward) ব্যবহার করে ব্যান্ডউইথের সর্বোচ্চ সদ্ব্যবহার করে।"}, {"id": 3, "topic": "Network Edge, Core & Protocol Layers", "question": "একটি প্যাকেটের দৈর্ঘ্য $L$ বিট এবং লিঙ্কের ট্রান্সমিশন রেট $R$ bps হলে ট্রান্সমিশন ডিলে (Transmission Delay) কত?", "options": ["ক) $L \\times R$", "খ) $L / R$", "গ) $R / L$", "ঘ) $d / s$"], "answer": "খ", "explanation": "ট্রান্সমিশন ডিলে হলো প্যাকেটের সমস্ত বিট লিঙ্কে পুশ করতে প্রয়োজনীয় সময়, যার সূত্র $d_{trans} = L / R$।"}, {"id": 4, "topic": "Network Edge, Core & Protocol Layers", "question": "দুটি রাউটারের মধ্যবর্তী দূরত্ব $d$ এবং সিগন্যালের গতি $s$ (প্রায় $2 \\times 10^8$ m/s) হলে প্রোপাগেশন ডিলে (Propagation Delay) কত?", "options": ["ক) $L / R$", "খ) $d / s$", "গ) $d \\times s$", "ঘ) $s / d$"], "answer": "খ", "explanation": "প্রোপাগেশন ডিলে হলো ফিজিক্যাল মাধ্যমে একটি বিটের এক প্রান্ত থেকে অন্য প্রান্তে পৌঁছানোর সময়, যার সূত্র $d_{prop} = d / s$।"}, {"id": 5, "topic": "Network Edge, Core & Protocol Layers", "question": "রাউটারের বাফারে যখন প্যাকেটের আগমন হার ট্রান্সমিশন হারের চেয়ে বেশি হয়, তখন কোন বিলম্ব বা ক্ষতি ঘটে?", "options": ["ক) কিউয়িং ডিলে (Queuing Delay) এবং প্যাকেট লস (Packet Loss / Drop)", "খ) প্রোপাগেশন ডিলে বৃদ্ধি পায়", "গ) আলোর গতি কমে যায়", "ঘ) রাউটারের হার্ডওয়্যার পুড়ে যায়"], "answer": "ক", "explanation": "বাফার ভরে গেলে প্যাকেটকে কিউতে অপেক্ষা করতে হয় (Queuing delay) এবং বাফার উপচে পড়লে নতুন প্যাকেট ড্রপ হয় যা Packet Loss হিসেবে পরিচিত।"}, {"id": 6, "topic": "Network Edge, Core & Protocol Layers", "question": "নোডাল প্রসেসিং ডিলে (Processing Delay) মূলত কীসের সাথে জড়িত?", "options": ["ক) তারের মধ্য দিয়ে বিট চলাচলের সময়", "খ) প্যাকেটের হেডার পরীক্ষা করা, বিট এরর চেক করা এবং আউটপুট লিঙ্ক নির্ধারণের সময়", "গ) ডিস্কে ফাইল সেভ করার সময়", "ঘ) ব্রাউজার রেন্ডারিং সময়"], "answer": "খ", "explanation": "Processing delay হলো রাউটারের প্রসেসর কর্তৃক প্যাকেটের হেডার পড়া, চেকসাম ভেরিফাই করা এবং রাউটিং টেবিল দেখে পরবর্তী লিঙ্ক বাছাইয়ের সময়।"}, {"id": 7, "topic": "Network Edge, Core & Protocol Layers", "question": "OSI মডেলের ৭টি লেয়ারের নিচের দিক থেকে উপরের দিকের সঠিক ক্রম কোনটি?", "options": ["ক) Physical -> Data Link -> Network -> Transport -> Session -> Presentation -> Application", "খ) Application -> Presentation -> Session -> Transport -> Network -> Data Link -> Physical", "গ) Physical -> Network -> Data Link -> Transport -> Session -> Presentation -> Application", "ঘ) Data Link -> Physical -> Transport -> Network -> Application -> Session -> Presentation"], "answer": "ক", "explanation": "OSI (Open Systems Interconnection) মডেলের স্তরগুলো হলো: ১. Physical, ২. Data Link, ৩. Network, ৪. Transport, ৫. Session, ৬. Presentation, এবং ৭. Application।"}, {"id": 8, "topic": "Network Edge, Core & Protocol Layers", "question": "TCP/IP প্রোটোকল স্যুটের ৫-স্তর বিশিষ্ট আর্কিটেকচারে কোন স্তর দুটিকে অ্যাপ্লিকেশন লেয়ারের মধ্যে একীভূত করা হয়েছে?", "options": ["ক) Session এবং Presentation লেয়ার", "খ) Data Link এবং Network লেয়ার", "গ) Transport এবং Network লেয়ার", "ঘ) Physical এবং Data Link লেয়ার"], "answer": "ক", "explanation": "TCP/IP মডেলে OSI-এর Session এবং Presentation লেয়ারের কার্যকারিতা সরাসরি Application লেয়ারের ভেতরেই সম্পাদন করা হয়।"}, {"id": 9, "topic": "Network Edge, Core & Protocol Layers", "question": "বিভিন্ন স্তরে প্রোটোকল ডেটা ইউনিটের (PDU) সঠিক মিল কোনটি?", "options": ["ক) Application: Message, Transport: Segment, Network: Datagram/Packet, Data Link: Frame, Physical: Bits", "খ) Transport: Packet, Network: Segment", "গ) Data Link: Packet, Network: Frame", "ঘ) Application: Frame, Data Link: Bits"], "answer": "ক", "explanation": "লেয়ার অনুযায়ী PDU-এর নাম: Application-এ Message, Transport-এ Segment, Network-এ Datagram/Packet, Data Link-এ Frame এবং Physical-এ Bits।"}, {"id": 10, "topic": "Network Edge, Core & Protocol Layers", "question": "প্রেরক প্রান্তে উচ্চ স্তর থেকে নিম্ন স্তরে নামার সময় প্রতিটি স্তরে হেডার যুক্ত হওয়ার প্রক্রিয়াকে কী বলে?", "options": ["ক) Decapsulation", "খ) Encapsulation (এনক্যাপসুলেশন)", "গ) Segmentation", "ঘ) Multiplexing"], "answer": "খ", "explanation": "Encapsulation হলো এমন এক প্রক্রিয়া যাতে প্রতিটি প্রোটোকল লেয়ার উচ্চতর লেয়ার থেকে পাওয়া ডেটার সাথে নিজস্ব কন্ট্রোল হেডার যোগ করে নিচের স্তরে পাঠায়।"}, {"id": 11, "topic": "Network Edge, Core & Protocol Layers", "question": "গ্রাহক প্রান্তে ফিজিক্যাল লেয়ার থেকে ডেটা উপরে ওঠার সময় হেডার খুলে ফেলার প্রক্রিয়াকে কী বলে?", "options": ["ক) Encapsulation", "খ) Decapsulation (ডিক্যাপসুলেশন)", "গ) Buffering", "ঘ) Routing"], "answer": "খ", "explanation": "Decapsulation হলো প্রতিটি স্তরে সংশ্লিষ্ট হেডারটি পরীক্ষা ও অপসরণ করে মূল পে-লোডটি উপরের স্তরে হস্তান্তর করার প্রক্রিয়া।"}, {"id": 12, "topic": "Network Edge, Core & Protocol Layers", "question": "হোম ব্রডব্যান্ডে ব্যবহৃত DSL (Digital Subscriber Line) প্রযুক্তিতে ডেটা স্থানান্তরের মাধ্যম কোনটি?", "options": ["ক) প্রচলিত কপার টেলিফোন লাইন (Twisted-pair telephone wire)", "খ) কো-অ্যাক্সিয়াল ক্যাবল টিভি তার", "গ) স্যাটেলাইট লিঙ্ক", "ঘ) পাওয়ার গ্রিড"], "answer": "ক", "explanation": "DSL বিদ্যমান টেলিফোন লাইনের উচ্চ ফ্রিকোয়েন্সি স্পেকট্রাম ব্যবহার করে ভয়েস ও ডেটা সিগন্যাল একই সাথে প্রেরণ করে।"}, {"id": 13, "topic": "Network Edge, Core & Protocol Layers", "question": "HFC (Hybrid Fiber-Coaxial) ক্যাবল ইন্টারনেট অ্যাক্সেস কোন ধরণের মিডিয়া ব্যবহার করে?", "options": ["ক) ক্যাবল হেডএন্ড পর্যন্ত ফাইবার অপটিক এবং গ্রাহকের বাড়ি পর্যন্ত কো-অ্যাক্সিয়াল ক্যাবল", "খ) শুধুমাত্র টুইস্টেড পেয়ার তার", "গ) ইনফ্রারেড রশ্মি", "ঘ) মাইক্রোওয়েভ লিঙ্ক"], "answer": "ক", "explanation": "ক্যাবল নেটওয়ার্কে ফাইবার ব্যাকবোন এবং বাড়িগুলোর সংযোগে কো-অ্যাক্সিয়াল ক্যাবল সমন্বিত থাকায় একে Hybrid Fiber-Coaxial (HFC) বলে।"}, {"id": 14, "topic": "Network Edge, Core & Protocol Layers", "question": "সার্কিট সুইচিং নেটওয়ার্কে মাল্টিপ্লেক্সিংয়ের দুটি বহুল ব্যবহৃত কৌশল কী কী?", "options": ["ক) FDM (Frequency-Division Multiplexing) এবং TDM (Time-Division Multiplexing)", "খ) TCP এবং UDP", "গ) HTTP এবং DNS", "ঘ) CSMA/CD এবং CSMA/CA"], "answer": "ক", "explanation": "সার্কিট সুইচিংয়ে চ্যানেল শেয়ার করতে ফ্রিকোয়েন্সি ভাগ করা (FDM) অথবা সময়কে টাইম-স্লটে ভাগ করা (TDM) ব্যবহৃত হয়।"}, {"id": 15, "topic": "Network Edge, Core & Protocol Layers", "question": "নেটওয়ার্ক বটলনেক লিঙ্ক (Bottleneck Link) বলতে কী বোঝায়?", "options": ["ক) এন্ড-টু-এন্ড পাথের যে লিঙ্কের ট্রান্সমিশন থ্রুপুট সর্বনিম্ন", "খ) সবচেয়ে দীর্ঘ ক্যাবল লিঙ্ক", "গ) সবচেয়ে দামি রাউটার", "ঘ) ওয়্যারলেস অ্যান্টেনা"], "answer": "ক", "explanation": "একটি নেটওয়ার্ক সংযোগের সামগ্রিক থ্রুপুট নির্ধারিত হয় পাথের সর্বনিম্ন ক্যাপাসিটির লিঙ্ক দ্বারা, যাকে Bottleneck Link বলে।"}, {"id": 16, "topic": "Network Edge, Core & Protocol Layers", "question": "ফিজিক্যাল লেয়ারের প্রধান দায়িত্ব কোনটি?", "options": ["ক) র বিট স্ট্রিমকে (0 এবং 1) ফিজিক্যাল মাধ্যমে ইলেকট্রিক্যাল, অপটিক্যাল বা রেডিও সিগন্যালে রূপান্তর ও স্থানান্তর", "খ) আইপি অ্যাড্রেসিং নির্ধারণ", "গ) প্রসেস-টু-প্রসেস সংযোগ স্থাপন", "ঘ) এইচটিটিপি মেমোরি ক্যাশ রাখা"], "answer": "ক", "explanation": "Physical Layer ফিজিক্যাল মিডিয়া (ক্যাবল/এয়ার)-র মধ্য দিয়ে বৈদ্যুতিক ভোল্টেজ বা আলোর স্পন্দন আকারে বিট পাঠানো ও গ্রহণ করার জন্য দায়ী।"}, {"id": 17, "topic": "Network Edge, Core & Protocol Layers", "question": "ডাটা লিঙ্ক লেয়ারের প্রধান কাজগুলোর মধ্যে কোনটি অন্তর্ভুক্ত?", "options": ["ক) একই লিঙ্কে নোড-টু-নোড বা হপ-টু-হপ ফ্রেম ডেলিভারি, ফ্রেমিং, ম্যাক অ্যাড্রেসিং এবং এরর ডিটেকশন (CRC)", "খ) গ্লোবাল রাউটিং অ্যালগরিদম চালানো", "গ) ইউজার ইন্টারফেস ডিজাইন", "ঘ) ডোমেইন নেম রেজোলিউশন"], "answer": "ক", "explanation": "Data Link Layer সংলগ্ন দুটি নোডের মধ্যে নির্ভরযোগ্য ডেটা ফ্রেম বিনিময়, মিডিয়া অ্যাক্সেস কন্ট্রোল (MAC) এবং লিঙ্ক-লেভেল ত্রুটি শনাক্ত করে।"}, {"id": 18, "topic": "Network Edge, Core & Protocol Layers", "question": "নেটওয়ার্ক লেয়ারের মূল কাজ কোনটি?", "options": ["ক) হোস্ট-টু-হোস্ট ডেলিভারি, লজিক্যাল অ্যাড্রেসিং (IP Addressing) এবং রাউটিং", "খ) প্রসেস-টু-প্রসেস ডেটা ট্রান্সফার", "গ) টেক্সট কম্প্রেশন", "ঘ) অ্যাপ্লিকেশন রেন্ডারিং"], "answer": "ক", "explanation": "Network Layer সোর্স হোস্ট থেকে ডেস্টিনেশন হোস্টে প্যাকেট পৌঁছে দেওয়ার জন্য লজিক্যাল আইপি অ্যাড্রেসিং এবং রাউটিং রুট নির্বাচন পরিচালনা করে।"}, {"id": 19, "topic": "Network Edge, Core & Protocol Layers", "question": "ট্রান্সপোর্ট লেয়ারের মূল লক্ষ্য কোনটি?", "options": ["ক) এক হোস্টের নির্দিষ্ট অ্যাপ প্রসেসের সাথে অন্য হোস্টের অ্যাপ প্রসেসের যোগাযোগ (Process-to-Process Delivery)", "খ) ফিজিক্যাল ক্যাবল সংযোগ", "গ) রাউটারের বাফার মেমরি ক্লিন করা", "ঘ) ম্যাক অ্যাড্রেস নির্ধারণ"], "answer": "ক", "explanation": "Transport Layer হোস্টের নির্দিষ্ট অ্যাপ্লিকেশন প্রসেসগুলোর মধ্যে এন্ড-টু-এন্ড যোগাযোগ, পোর্ট অ্যাড্রেসিং, মাল্টিপ্লেক্সিং ও নির্ভরযোগ্যতা নিশ্চিত করে।"}, {"id": 20, "topic": "Network Edge, Core & Protocol Layers", "question": "OSI মডেলের প্রেজেন্টেশন লেয়ারের (Presentation Layer) প্রধান কাজ কোনটি?", "options": ["ক) ডেটা ট্রান্সলেশন, ক্যারেক্টার এনকোডিং (ASCII/Unicode), ডেটা এনক্রিপশন ও কম্প্রেশন", "খ) প্যাকেট রাউটিং", "গ) বিট সিনক্রোনাইজেশন", "ঘ) ফিজিক্যাল টপোলজি তৈরি"], "answer": "ক", "explanation": "Presentation Layer ডেটার বিন্যাস ও সিনট্যাক্স হ্যান্ডেল করে; যার মধ্যে ডেটা রূপান্তর, এনক্রিপশন/ডিক্রিপশন এবং কম্প্রেশন অন্তর্ভুক্ত।"}, {"id": 21, "topic": "Network Edge, Core & Protocol Layers", "question": "OSI সেশন লেয়ারের (Session Layer) প্রধান কাজ কী?", "options": ["ক) দুটি ডিভাইসের মধ্যে ডায়ালগ কন্ট্রোল, সেশন প্রতিষ্ঠা, রক্ষণাবেক্ষণ ও সিনক্রোনাইজেশন চেকপয়েন্ট স্থাপন", "খ) প্যাকেট ড্রপ রোধ", "গ) আইপি সাবনেটিং", "ঘ) সিআরসি চেক"], "answer": "ক", "explanation": "Session Layer যোগাযোগকারী অ্যাপ্লিকেশনের মধ্যে ডায়ালগ শুরু, শেষ এবং কোনো ত্রুটি হলে পূর্বের চেকপয়েন্ট থেকে রিকভারি পরিচালনা করে।"}, {"id": 22, "topic": "Network Edge, Core & Protocol Layers", "question": "ইন্টারনেটের মূল চালিকাশক্তি 'Best-effort delivery' সার্ভিস মডেল কোন লেয়ারের অন্তর্গত?", "options": ["ক) Network Layer (IP Protocol)", "খ) Application Layer", "গ) Session Layer", "ঘ) Presentation Layer"], "answer": "ক", "explanation": "ইন্টারনেট প্রোটোকল (IP) একটি Best-effort সার্ভিস, যার অর্থ এটি প্যাকেট পৌঁছানোর শতভাগ গ্যারান্টি, সঠিক অর্ডার বা বিলম্বহীনতার নিশ্চয়তা দেয় না।"}, {"id": 23, "topic": "Network Edge, Core & Protocol Layers", "question": "Layer-2 ডিভাইস এবং Layer-3 ডিভাইসের যথোপযুক্ত উদাহরণ কোনটি?", "options": ["ক) Layer-2: ইথারনেট সুইচ (Switch), Layer-3: রাউটার (Router)", "খ) Layer-2: হাব, Layer-3: ক্যাবল", "গ) Layer-2: রাউটার, Layer-3: সুইচ", "ঘ) Layer-2: রিপিটার, Layer-3: হাব"], "answer": "ক", "explanation": "সাধারণ সুইচ ম্যাক অ্যাড্রেসের ভিত্তিতে লেয়ার-২ (Data Link)-এ কাজ করে, আর রাউটার আইপি অ্যাড্রেস দেখে লেয়ার-৩ (Network)-এ কাজ করে।"}, {"id": 24, "topic": "Network Edge, Core & Protocol Layers", "question": "কম্পিউটার নেটওয়ার্কে 'থ্রুপুট' (Throughput) বলতে কী বোঝায়?", "options": ["ক) প্রতি একক সময়ে গ্রাহক প্রান্তে সফলভাবে পৌঁছানো বাস্তব ডেটা বিটের হার (Rate)", "খ) ক্যাবলের মোট দৈর্ঘ্য", "গ) রাউটারের মেমরি ধারণক্ষমতা", "ঘ) আইপি অ্যাড্রেসের সংখ্যা"], "answer": "ক", "explanation": "Throughput হলো কোনো নির্দিষ্ট সময়ে নেটওয়ার্কের এক প্রান্ত থেকে অন্য প্রান্তে সফলভাবে স্থানান্তরিত তথ্যের কার্যকরী হার (সাধারণত bps বা Mbps এককে)।"}, {"id": 25, "topic": "Network Edge, Core & Protocol Layers", "question": "একটি কম্পিউটার নেটওয়ার্কে ডস বা ডিডস (DoS/DDoS) আক্রমণের মূল উদ্দেশ্য কী?", "options": ["ক) অতিরিক্ত কৃত্রিম ট্রাফিক পাঠিয়ে সার্ভার বা নেটওয়ার্ক রিসোর্সকে ক্র্যাশ করিয়ে বৈধ গ্রাহকদের সেবা থেকে বঞ্চিত করা", "খ) ইউজারের পাসওয়ার্ড চুরি করা", "গ) হার্ডডিস্ক চুরি করা", "ঘ) ক্যাবল কেটে ফেলা"], "answer": "ক", "explanation": "Denial of Service (DoS/DDoS) আক্রমণে বটনেট ব্যবহার করে টার্গেট সিস্টেমে প্লাডিং ঘটিয়ে সার্ভারকে আনরেসপনসিভ বা ওভারলোড করে দেওয়া হয়।"}, {"id": 26, "topic": "Application Layer Protocols", "question": "ক্লায়েন্ট-সার্ভার (Client-Server) আর্কিটেকচার এবং পিয়ার-টু-পিয়ার (P2P) আর্কিটেকচারের প্রধান পার্থক্য কোনটি?", "options": ["ক) ক্লায়েন্ট-সার্ভারে সর্বদা সক্রিয় একটি কেন্দ্রীয় সার্ভার থাকে, আর P2P-তে যেকোনো পিয়ার ডিভাইস একই সাথে ক্লায়েন্ট ও সার্ভার উভয় হিসেবে কাজ করে", "খ) P2P-তে কোনো ইন্টারনেট লাগে না", "গ) ক্লায়েন্ট-সার্ভারে কোনো ডেটাবেজ থাকে না", "ঘ) উভয়েই সম্পূর্ণ অভিন্ন"], "answer": "ক", "explanation": "P2P আর্কিটেকচারে (যেমন BitTorrent) প্রতিটি নোড (Peer) সরাসরি একে অপরের সাথে ডেটা শেয়ার করে, ফলে এটি স্বয়ংক্রিয়ভাবে অত্যন্ত স্কেলেবল (Self-scalability)।"}, {"id": 27, "topic": "Application Layer Protocols", "question": "নেটওয়ার্ক অ্যাপ্লিকেশনে 'সকেট' (Socket) বলতে কী বোঝায়?", "options": ["ক) অ্যাপ্লিকেশন লেয়ার এবং ট্রান্সপোর্ট লেয়ারের মধ্যবর্তী সফটওয়্যার ইন্টারফেস বা ডোরওয়ে (Doorway)", "খ) মাদারবোর্ডের প্রসেসর বসানোর স্লট", "গ) ক্যাবলের আরজে-৪৫ কানেক্টর", "ঘ) ব্রাউজারের বুকমার্ক"], "answer": "ক", "explanation": "সকেট হলো অ্যাপ্লিকেশন প্রসেস এবং আন্ডারলাইং নেটওয়ার্কের মধ্যে প্রোগ্রাম্যাটিক ইন্টারফেস যার মাধ্যমে প্রসেস নেটওয়ার্কে ডেটা পাঠায় ও গ্রহণ করে।"}, {"id": 28, "topic": "Application Layer Protocols", "question": "HTTP প্রোটোকলকে 'Stateless Protocol' বলা হয় কেন?", "options": ["ক) সার্ভার অতীতের ক্লায়েন্ট রিকোয়েস্ট সম্পর্কে কোনো স্টেট বা তথ্য স্মৃতিতে সংরক্ষণ করে রাখে না", "খ) এটি কোনো সিকিউরিটি দেয় না", "গ) এটি ক্যাশে কাজ করে না", "ঘ) এতে কোনো ছবি দেখা যায় না"], "answer": "ক", "explanation": "HTTP প্রতিটি রিকোয়েস্টকে সম্পূর্ণ স্বাধীন ও নতুন হিসেবে বিবেচনা করে এবং আগের কোনো ট্রানজ্যাকশন মনে রাখে না। এজন্যই ক্লায়েন্ট সেশন ধরে রাখতে Cookies ব্যবহৃত হয়।"}, {"id": 29, "topic": "Application Layer Protocols", "question": "Non-persistent HTTP এবং Persistent HTTP-র মধ্যে প্রধান পার্থক্য কোনটি?", "options": ["ক) Non-persistent-এ প্রতি অবজেক্টের জন্য নতুন TCP কানেকশন খোলা ও বন্ধ হয়, Persistent-এ একটি একক TCP কানেকশনেই একাধিক ওয়েব অবজেক্ট পাঠানো যায়", "খ) Non-persistent অনেক দ্রুত", "গ) Persistent-এ UDP ব্যবহৃত হয়", "ঘ) এদের মধ্যে কোনো পার্থক্য নেই"], "answer": "ক", "explanation": "HTTP/1.0 ছিল Non-persistent (প্রতি অবজেক্টে 2 RTT ওভারহেড)। HTTP/1.1 এ Persistent Connection ডিফল্ট করা হয় যাতে একই সকেটে পাইপলাইনিংয়ের সুবিধা পাওয়া যায়।"}, {"id": 30, "topic": "Application Layer Protocols", "question": "একটি ছোট প্যাকেট ক্লায়েন্ট থেকে সার্ভারে গিয়ে ফিরে আসতে যে সময় নেয় তাকে কী বলা হয়?", "options": ["ক) RTT (Round Trip Time)", "খ) MTU (Maximum Transmission Unit)", "গ) TTL (Time To Live)", "ঘ) MSS (Maximum Segment Size)"], "answer": "ক", "explanation": "Round-Trip Time (RTT) হলো ডেটার একপ্রান্ত থেকে অন্যপ্রান্তে পৌঁছানো এবং তার স্বীকৃতি (ACK) ফিরে আসার মোট সময়।"}, {"id": 31, "topic": "Application Layer Protocols", "question": "HTTP স্ট্যাটাস কোড '200 OK' এবং '404 Not Found'-এর অর্থ কী?", "options": ["ক) 200: অনুরোধ সফল হয়েছে, 404: কাঙ্ক্ষিত রিসোর্স সার্ভারে পাওয়া যায়নি", "খ) 200: পেজ ডিলিট হয়েছে, 404: সফল", "গ) 200: সার্ভার ক্র্যাশ, 404: রিডাইরেক্ট", "ঘ) উভয়ই এরর কোড"], "answer": "ক", "explanation": "HTTP স্ট্যাটাস কোডে 2xx মানে সাফল্য (Success) এবং 4xx মানে ক্লায়েন্ট এরর (Client Error)।"}, {"id": 32, "topic": "Application Layer Protocols", "question": "HTTP স্ট্যাটাস কোড 301, 400 এবং 500 যথাক্রমে কী নির্দেশ করে?", "options": ["ক) 301: Moved Permanently, 400: Bad Request, 500: Internal Server Error", "খ) 301: OK, 400: Gateway Timeout, 500: Unauthorized", "গ) 301: Forbidden, 400: Created, 500: OK", "ঘ) 301: Found, 400: Server Busy, 500: Success"], "answer": "ক", "explanation": "3xx হলো রিডাইরেকশন (Moved Permanently), 400 হলো ক্লায়েন্টের অবৈধ সিনট্যাক্স (Bad Request), এবং 500 হলো সার্ভার সাইডের ক্র্যাশ বা এরর।"}, {"id": 33, "topic": "Application Layer Protocols", "question": "ওয়েব ক্যাশিং (Web Caching বা Proxy Server) ব্যবহারের প্রধান সুবিধা কোনটি?", "options": ["ক) ক্লায়েন্টের রেসপন্স টাইম নাটকীয়ভাবে কমে এবং প্রতিষ্ঠানের অ্যাক্সেস লিঙ্কের ট্রাফিক হ্রাস পায়", "খ) ব্রাউজারের র‍্যাম বৃদ্ধি পায়", "গ) আইপি অ্যাড্রেস স্থায়ী হয়", "ঘ) কোনো ইন্টারনেটের প্রয়োজন হয় না"], "answer": "ক", "explanation": "প্রক্সি ক্যাশ সার্ভার লোকাল নেটওয়ার্কে ঘন ঘন অনুরোধকৃত ওয়েব পেজ সেভ রাখে, ফলে বারবার দূরবর্তী অরিজিন সার্ভারে যেতে হয় না।"}, {"id": 34, "topic": "Application Layer Protocols", "question": "ক্যাশ সার্ভারে থাকা অবজেক্ট অরিজিন সার্ভারের চেয়ে পুরোনো বা পরিবর্তিত হয়েছে কিনা তা যাচাই করতে কোন HTTP হেডার ব্যবহৃত হয়?", "options": ["ক) Conditional GET (If-Modified-Since)", "খ) User-Agent", "গ) Content-Type", "ঘ) Accept-Language"], "answer": "ক", "explanation": "ক্যাশ সার্ভার `If-Modified-Since` হেডার দিয়ে অরিজিন সার্ভারে চেক করে। যদি পরিবর্তন না হয়, তবে সার্ভার '304 Not Modified' পাঠায়, যা নতুন করে বডি পাঠানো বন্ধ করে ব্যান্ডউইথ বাঁচায়।"}, {"id": 35, "topic": "Application Layer Protocols", "question": "HTTP/2 প্রোটোকলের প্রধান উন্নতি কোনটি ছিল?", "options": ["ক) একই TCP কানেকশনে বাইনারি ফ্রেমিং এবং মাল্টিপ্লেক্সিং (Multiplexing) এর মাধ্যমে Head-of-Line Blocking দূর করা", "খ) UDP প্রোটোকলে রূপান্তর", "গ) টেক্সট ফরম্যাট বাধ্যতামূলক করা", "ঘ) কোনো সিকিউরিটি না রাখা"], "answer": "ক", "explanation": "HTTP/2单一 TCP কানেকশনে একাধিক রিকোয়েস্ট ও রেসপন্স স্ট্রিমকে প্যারালালে ইন্টারলিভ করে আদান-প্রদান করতে পারে।"}, {"id": 36, "topic": "Application Layer Protocols", "question": "HTTP/3 প্রোটোকল ট্রান্সপোর্ট লেয়ারে TCP-র বদলে কোন প্রোটোকল ব্যবহার করে?", "options": ["ক) QUIC (UDP ভিত্তিক)", "খ) ICMP", "গ) OSPF", "ঘ) IGMP"], "answer": "ক", "explanation": "HTTP/3 গুগল উদ্ভাবিত QUIC প্রোটোকল ব্যবহার করে যা UDP-র উপর নির্মিত এবং TCP-র হ্যান্ডশেক ডিলে ও ট্রান্সপোর্ট লেভেলের HOL ব্লকিং দূর করে।"}, {"id": 37, "topic": "Application Layer Protocols", "question": "FTP (File Transfer Protocol) একই সাথে দুটি প্যারালাল সংযোগ ব্যবহার করে। সেগুলো কী কী এবং তাদের ডিফল্ট পোর্ট কত?", "options": ["ক) কন্ট্রোল সংযোগ (Control: Port 21) এবং ডেটা সংযোগ (Data: Port 20)", "খ) রিড সংযোগ (Port 80) এবং রাইট সংযোগ (Port 443)", "গ) ফাইল পোর্ট 25 এবং কমান্ড পোর্ট 53", "ঘ) সিঙ্গেল পোর্ট 22"], "answer": "ক", "explanation": "FTP 'Out-of-band' কন্ট্রোল ব্যবহার করে। কমান্ড আদান-প্রদানে পোর্ট ২১ এবং বাস্তব ফাইল ডেটা ট্রান্সফারে পোর্ট ২০ ব্যবহৃত হয়।"}, {"id": 38, "topic": "Application Layer Protocols", "question": "ইলেকট্রনিক মেইল পাঠাতে ক্লায়েন্ট থেকে মেল সার্ভারে কোন প্রোটোকল ব্যবহৃত হয়?", "options": ["ক) SMTP (Simple Mail Transfer Protocol - Port 25)", "খ) POP3", "গ) IMAP", "ঘ) SNMP"], "answer": "ক", "explanation": "SMTP হলো একটি পুশ প্রোটোকল যা মেইল পাঠানো বা সার্ভার টু সার্ভার মেইল ফরোয়ার্ডিংয়ে ব্যবহৃত হয় (ডিফল্ট পোর্ট ২৫/৫৮৭)।"}, {"id": 39, "topic": "Application Layer Protocols", "question": "মেইল সার্ভার থেকে ক্লায়েন্ট ডিভাইসে ইমেইল ডাউনলোড/অ্যাক্সেস করার দুটি প্রধান প্রোটোকল কোনগুলো?", "options": ["ক) POP3 (Post Office Protocol 3) এবং IMAP (Internet Message Access Protocol)", "খ) SMTP এবং HTTP", "গ) FTP এবং TFTP", "ঘ) DNS এবং DHCP"], "answer": "ক", "explanation": "মেইল রিড করার জন্য POP3 (পোর্ট ১১০) এবং IMAP (পোর্ট ১৪৩) ব্যবহৃত হয়। IMAP সার্ভারে মেইল সিঙ্ক রাখে যা একাধিক ডিভাইস থেকে অ্যাক্সেসে সুবিধাজনক।"}, {"id": 40, "topic": "Application Layer Protocols", "question": "নন-টেক্সট মাল্টিমিডিয়া ফাইল (যেমন ছবি, অডিও, পিডিএফ) ইমেইলের সাথে সংযুক্ত করার জন্য কোন স্ট্যান্ডার্ড ব্যবহৃত হয়?", "options": ["ক) MIME (Multipurpose Internet Mail Extensions)", "খ) ASCII 7-bit", "গ) BASE16", "ঘ) HTML5"], "answer": "ক", "explanation": "MIME ঐতিহ্যবাহী 7-bit ASCII মেইল ব্যবস্থাকে প্রসারিত করে বাইনারি ফাইল ও মাল্টিমিডিয়া অ্যাটাচমেন্ট ট্রান্সমিট করার সুযোগ দেয়।"}, {"id": 41, "topic": "Application Layer Protocols", "question": "ডোমেইন নেম সিস্টেমের (DNS) প্রধান কাজ কোনটি এবং এটি কোন ট্রান্সপোর্ট প্রোটোকল ও পোর্ট ব্যবহার করে?", "options": ["ক) মানুষের পাঠযোগ্য হোস্টনেমকে (যেমন www.google.com) আইপি অ্যাড্রেসে (যেমন 142.250.x.x) রূপান্তর করা; UDP পোর্ট 53 ব্যবহার করে", "খ) ফাইল ডাউনলোড করা; TCP পোর্ট 21", "গ) রাউটার কনফিগার করা; TCP পোর্ট 23", "ঘ) ওয়েবসাইট হোস্টিং করা; পোর্ট 80"], "answer": "ক", "explanation": "DNS ইন্টারনেটের ডিরেক্টরি সার্ভিস যা হোস্টনেম টু আইপি রেজোলিউশন করে। দ্রুততার জন্য স্ট্যান্ডার্ড কুয়েরিতে UDP পোর্ট ৫৩ ব্যবহৃত হয়।"}, {"id": 42, "topic": "Application Layer Protocols", "question": "DNS-এর হায়ারার্কিক্যাল ডেটাবেজের স্তরগুলোর সঠিক ক্রম কোনটি?", "options": ["ক) Root DNS Servers -> TLD (Top-Level Domain) Servers -> Authoritative DNS Servers", "খ) Local DNS -> Root DNS -> TLD", "গ) TLD -> Root -> Local", "ঘ) Authoritative -> Root -> TLD"], "answer": "ক", "explanation": "DNS ট্রি কাঠামোতে সবার উপরে থাকে Root Servers, তার নিচে TLD (যেমন .com, .org, .bd), এবং সর্বশেষে নির্দিষ্ট ডোমেইনের Authoritative DNS Servers।"}, {"id": 43, "topic": "Application Layer Protocols", "question": "DNS রিসোর্স রেকর্ডে (Resource Record - RR) হোস্টনেমের আইপি অ্যাড্রেস সংরক্ষণের টাইপ কোনটি?", "options": ["ক) Type A (IPv4 এর জন্য) এবং Type AAAA (IPv6 এর জন্য)", "খ) Type NS", "গ) Type CNAME", "ঘ) Type MX"], "answer": "ক", "explanation": "Type A রেকর্ড হোস্টনেমের IPv4 অ্যাড্রেস এবং Type AAAA রেকর্ড IPv6 অ্যাড্রেস সংরক্ষণ করে।"}, {"id": 44, "topic": "Application Layer Protocols", "question": "DNS রেকর্ডে একটি মেইল সার্ভারের নাম নির্দেশ করতে কোন রেকর্ড টাইপ ব্যবহৃত হয়?", "options": ["ক) MX (Mail Exchange)", "খ) CNAME", "গ) PTR", "ঘ) TXT"], "answer": "ক", "explanation": "MX রেকর্ড ডোমেইনের ইনকামিং ইমেইল পরিচালনার দায়িত্বে নিয়োজিত মেইল সার্ভারকে নির্দেশ করে।"}, {"id": 45, "topic": "Application Layer Protocols", "question": "DNS-এ কোনো হোস্টনেমের জন্য ক্যানোনিকাল বা আসল নামের অপর একটি অ্যালিয়াস (Alias) নাম নির্দেশ করতে কোন রেকর্ড ব্যবহৃত হয়?", "options": ["ক) CNAME (Canonical Name)", "খ) A Record", "গ) SOA", "ঘ) NS"], "answer": "ক", "explanation": "CNAME রেকর্ড একটি অ্যালিয়াস ডোমেইনকে তার আসল ক্যানোনিকাল ডোমেইনের সাথে ম্যাপ করে।"}, {"id": 46, "topic": "Application Layer Protocols", "question": "DNS কুয়েরিতে রিকার্সিভ (Recursive) এবং ইটারেটিভ (Iterative) কুয়েরির মধ্যে পার্থক্য কী?", "options": ["ক) রিকার্সিভ কুয়েরিতে সার্ভার নিজে পরবর্তী সার্ভারগুলো থেকে উত্তর খুঁজে ক্লায়েন্টকে দেয়, আর ইটারেটিভে সার্ভার ক্লায়েন্টকে পরবর্তী রেফারেল সার্ভারের ঠিকানা দেয়", "খ) রিকার্সিভ কুয়েরি কখনোই উত্তর দেয় না", "গ) ইটারেটিভ কুয়েরি ব্রাউজারে হয় না", "ঘ) উভয়েই সম্পূর্ণ একই"], "answer": "ক", "explanation": "ক্লায়েন্ট পিসি লোকাল DNS সার্ভারকে সাধারণত Recursive কুয়েরি পাঠায়, আর লোকাল DNS সার্ভার Root, TLD এবং Authoritative সার্ভারগুলোতে Iterative কুয়েরি চালায়।"}, {"id": 47, "topic": "Application Layer Protocols", "question": "DNS কুয়েরির রেসপন্স ক্লায়েন্ট ও লোকাল সার্ভারে কতক্ষণ সংরক্ষিত থাকবে তা কোন ফিল্ড নির্ধারণ করে?", "options": ["ক) TTL (Time To Live)", "খ) MTU", "গ) Window Size", "ঘ) Checksum"], "answer": "ক", "explanation": "TTL মান সেকেন্ড এককে নির্দেশ করে ডিএনএস ক্যাশে রেকর্ডটি কতক্ষণ সতেজ থাকবে। TTL শেষ হলে পুনরায় মূল সার্ভারে কুয়েরি করা হয়।"}, {"id": 48, "topic": "Application Layer Protocols", "question": "টেলনেট (Telnet) এবং এসএসএইচ (SSH)-এর মধ্যে নিরাপত্তার ক্ষেত্রে প্রধান পার্থক্য কী?", "options": ["ক) Telnet সমতল টেক্সটে (Plaintext - Unencrypted) পাসওয়ার্ড পাঠায়, আর SSH সম্পূর্ণ ট্রাফিক ক্রিপ্টোগ্রাফিকভাবে এনক্রিপ্ট করে পাঠায়", "খ) Telnet অনেক সুরক্ষিত", "গ) SSH কোনো টার্মিনাল দেয় না", "ঘ) Telnet পোর্ট 22 ব্যবহার করে"], "answer": "ক", "explanation": "Telnet (পোর্ট ২৩) অনিরাপদ কারণ এতে পাসওয়ার্ড স্নাইফ করা যায়। SSH (Secure Shell - পোর্ট ২২) সুরক্ষিত এনক্রিপ্টেড রিমোট লগইন প্রদান করে।"}, {"id": 49, "topic": "Application Layer Protocols", "question": "DHCP (Dynamic Host Configuration Protocol) নেটওয়ার্কে কী কাজ করে?", "options": ["ক) ক্লায়েন্ট কম্পিউটারগুলোকে স্বয়ংক্রিয়ভাবে ডায়নামিক IP অ্যাড্রেস, সাবনেট মাস্ক, ডিফল্ট গেটওয়ে ও DNS সার্ভারের ঠিকানা বরাদ্দ করে", "খ) হার্ডডিস্ক ফরম্যাট করে", "গ) ভাইরাস স্ক্যান করে", "ঘ) ওয়েবসাইট ব্লক করে"], "answer": "ক", "explanation": "DHCP একটি নেটওয়ার্ক ম্যানেজমেন্ট প্রোটোকল যা DORA (Discover, Offer, Request, Acknowledge) প্রক্রিয়ায় স্বয়ংক্রিয়ভাবে আইপি কনফিগারেশন প্রদান করে।"}, {"id": 50, "topic": "Application Layer Protocols", "question": "DHCP প্রক্রিয়ার সঠিক ৪টি ধাপের ক্রম (DORA) কোনটি?", "options": ["ক) Discover -> Offer -> Request -> Acknowledge", "খ) Demand -> Order -> Receive -> Accept", "গ) Data -> Open -> Read -> Action", "ঘ) Direct -> Option -> Route -> Assign"], "answer": "ক", "explanation": "DHCP ক্লায়েন্ট প্রথমে DHCPDISCOVER ব্রডকাস্ট করে, সার্ভার DHCPOFFER দেয়, ক্লায়েন্ট DHCPREQUEST পাঠায় এবং সার্ভার DHCPACK দিয়ে আইপি নিশ্চিত করে।"}, {"id": 51, "topic": "Application Layer Protocols", "question": "নেটওয়ার্ক ডিভাইস (যেমন রাউটার, সুইচ) মনিটরিং ও পরিচালনার জন্য আদর্শ প্রোটোকল কোনটি?", "options": ["ক) SNMP (Simple Network Management Protocol)", "খ) SMTP", "গ) IMAP", "ঘ) RIP"], "answer": "ক", "explanation": "SNMP প্রোটোকল নেটওয়ার্ক অ্যাডমিনিস্ট্রেটরদের বিভিন্ন ডিভাইসের পারফরম্যান্স ও ত্রুটি ট্র্যাক করতে (MIB ডেটাবেজের মাধ্যমে) ব্যবহৃত হয়।"}, {"id": 52, "topic": "Application Layer Protocols", "question": "HTTP সিকিউর (HTTPS) কোন ক্রিপ্টোগ্রাফিক প্রোটোকল ব্যবহার করে ট্রাফিক এনক্রিপ্ট করে এবং এর ডিফল্ট পোর্ট কত?", "options": ["ক) TLS/SSL (Transport Layer Security); Port 443", "খ) IPsec; Port 80", "গ) WEP; Port 21", "ঘ) DES; Port 25"], "answer": "ক", "explanation": "HTTPS হলো HTTP-র একটি এনক্রিপ্টেড সংস্করণ যা TLS/SSL প্রোটোকলের মাধ্যমে কাজ করে এবং ডিফল্টভাবে TCP পোর্ট 443 ব্যবহার করে।"}, {"id": 53, "topic": "Application Layer Protocols", "question": "ক্লায়েন্ট সাইডে ব্যবহারকারীর ট্র্যাকিং, শপিং কার্ট এবং লগইন সেশন মনে রাখার জন্য কোন মেকানিজম বহুল ব্যবহৃত হয়?", "options": ["ক) Cookies (কুকিজ)", "খ) Proxy", "গ) DNS CNAME", "ঘ) Gateway"], "answer": "ক", "explanation": "HTTP রেসপন্সে সার্ভার `Set-Cookie` হেডার পাঠায় এবং পরবর্তীতে ক্লায়েন্ট প্রতি রিকোয়েস্টে `Cookie` হেডারে সেশন আইডি পাঠায়।"}, {"id": 54, "topic": "Application Layer Protocols", "question": "কন্টেন্ট ডেলিভারি নেটওয়ার্কের (CDN) প্রধান উদ্দেশ্য কোনটি?", "options": ["ক) বিশ্বব্যাপী ছড়িয়ে থাকা এজ-সার্ভারে কনটেন্ট ক্যাশ রেখে ব্যবহারকারীর ভৌগোলিক দূরত্বের নিকটতম সার্ভার থেকে দ্রুত ওয়েবসাইট লোড নিশ্চিত করা", "খ) অরিজিন সার্ভারের সিপিইউ পরিবর্তন করা", "গ) ব্রাউজার তৈরি করা", "ঘ) ক্লায়েন্টের ইন্টারনেট বিল কমানো"], "answer": "ক", "explanation": "CDN (যেমন Cloudflare, Akamai) স্ট্যাটিক ও ডাইনামিক কনটেন্টকে ইউজারের কাছাকাছি এজ সার্ভারে ক্যাশ করে ল্যাটেন্সি কমায় এবং সার্ভারের ট্রাফিক চাপ দূর করে।"}, {"id": 55, "topic": "Application Layer Protocols", "question": "BitTorrent প্রোটোকলে 'Choking' এবং 'Tit-for-Tat' অ্যালগরিদমের উদ্দেশ্য কী?", "options": ["ক) যেসকল পিয়ার সর্বোচ্চ আপলোড রেটে ডেটা সরবরাহ করে কেবল তাদেরকেই ডেটা ডাউনলোড করতে দেওয়া (ফ্রি-রাইডার রোধ করা)", "খ) সব সংযোগ বন্ধ করে দেওয়া", "গ) সকল ফাইল এনক্রিপ্ট করা", "ঘ) সার্ভার বন্ধ রাখা"], "answer": "ক", "explanation": "Tit-for-Tat নীতি নিশ্চিত করে যে একজন পিয়ার যত বেশি আপলোড করবে, সে তত বেশি ডাউনলোড ব্যান্ডউইথ পাবে; ফলে নেটওয়ার্কে স্বার্থপর ফ্রি-লোডারদের দৌরাত্ম্য বন্ধ হয়।"}, {"id": 56, "topic": "Transport Layer Protocols & Services", "question": "ট্রান্সপোর্ট লেয়ারে মাল্টিপ্লেক্সিং (Multiplexing) এবং ডিমাল্টিপ্লেক্সিং (Demultiplexing) মূলত কোন তথ্যের ওপর ভিত্তি করে পরিচালিত হয়?", "options": ["ক) সোর্স পোর্ট নম্বর এবং ডেস্টিনেশন পোর্ট নম্বর (Port Numbers)", "খ) ম্যাক অ্যাড্রেস", "গ) কেবল তারের দৈর্ঘ্য", "ঘ) ওয়েব ব্রাউজারের ভার্সন"], "answer": "ক", "explanation": "ট্রান্সপোর্ট লেয়ার প্যাকেটগুলোকে সঠিক অ্যাপ্লিকেশন সকেটে পৌঁছে দিতে সেগমেন্ট হেডারের পোর্ট নম্বর (Port Number) ব্যবহার করে।"}, {"id": 57, "topic": "Transport Layer Protocols & Services", "question": "ওয়েল-নোন পোর্ট নম্বরের (Well-known Ports) সীমা কত?", "options": ["ক) 0 থেকে 1023", "খ) 1024 থেকে 49151", "গ) 49152 থেকে 65535", "ঘ) 1 থেকে 255"], "answer": "ক", "explanation": "IANA দ্বারা নির্ধারিত: 0-1023 হলো Well-known ports (স্ট্যান্ডার্ড সার্ভিসের জন্য যেমন HTTP: 80, SSH: 22); 1024-49151 হলো Registered; এবং 49152-65535 হলো Dynamic/Private ports।"}, {"id": 58, "topic": "Transport Layer Protocols & Services", "question": "UDP (User Datagram Protocol)-এর প্রধান বৈশিষ্ট্য কোনটি?", "options": ["ক) এটি কানেকশনলেস (Connectionless), অনির্ভরযোগ্য (Unreliable), কোনো কনজেশন বা ফ্লো কন্ট্রোল নেই কিন্তু ন্যূনতম ওভারহেড বিশিষ্ট", "খ) এটি শতভাগ ডেটা গ্যারান্টি দেয়", "গ) এতে ৩-ওয়ে হ্যান্ডশেক হয়", "ঘ) এর হেডার সাইজ ২০ বাইট"], "answer": "ক", "explanation": "UDP কোনো সংযোগ স্থাপন ছাড়াই সরাসরি সেগমেন্ট পাঠায়। এর কোনো রিট্রান্সমিশন মেকানিজম নেই বিধায় এটি অত্যন্ত দ্রুত এবং রিয়েল-টাইম স্ট্রিমিং ও ডিএনএসের জন্য উপযুক্ত।"}, {"id": 59, "topic": "Transport Layer Protocols & Services", "question": "UDP হেডারের আকার কত বাইট এবং এতে কয়টি ফিল্ড থাকে?", "options": ["ক) ৮ বাইট (৪টি ফিল্ড: Source Port, Destination Port, Length, Checksum)", "খ) ২০ বাইট", "গ) ৪০ বাইট", "ঘ) ৪ বাইট"], "answer": "ক", "explanation": "UDP হেডার অত্যন্ত সংক্ষিপ্ত (মাত্র ৮ বাইট), যাতে প্রতিটি ২ বাইট করে মোট ৪টি ফিল্ড থাকে: সোর্স পোর্ট, ডেস্টিনেশন পোর্ট, মোট দৈর্ঘ্য এবং এরর চেকসাম।"}, {"id": 60, "topic": "Transport Layer Protocols & Services", "question": "ইন্টারনেট চেকসাম (Checksum) গণনায় বিটগুলো কীভাবে যোগ করা হয়?", "options": ["ক) ১৬-বিট পূর্ণসংখ্যাগুলোর 1's Complement যোগফল নিয়ে তার বিপরীত (Inversion) করা হয়", "খ) সাধারণ XOR অপারেশন", "গ) 2's Complement গুণফল", "ঘ) CRC-32 ম্যাট্রিক্স"], "answer": "ক", "explanation": "ইন্টারনেট চেকসামে হেডারের সমস্ত ১৬-বিট শব্দ 1's complement নিয়মে যোগ করা হয় এবং ফলাফলের 1's complement নিয়ে চেকসাম ফিল্ডে বসানো হয়।"}, {"id": 61, "topic": "Transport Layer Protocols & Services", "question": "রিয়েল-টাইম ভিডিও কনফারেন্সিং বা অনলাইন গেমিংয়ে TCP-র চেয়ে UDP বেশি পছন্দের কারণ কোনটি?", "options": ["ক) হ্যান্ডশেক ডিলে নেই এবং প্যাকেট হারালেও রিট্রান্সমিশনের জন্য পুরো স্ট্রিমকে আটকে রাখে না (No retransmission delay)", "খ) UDP সকল প্যাকেট খুঁজে দেয়", "গ) UDP ডেটা কম্প্রেস করে", "ঘ) TCP-র চেয়ে ধীরগতির"], "answer": "ক", "explanation": "লাইভ ভিডিওতে হারানো ফ্রেম পুনরায় পাঠানোর চেয়ে সময়মতো পরবর্তী ফ্রেম দেখানো গুরুত্বপূর্ণ। TCP-র রিট্রান্সমিশন ও ফ্লো কন্ট্রোল ল্যাগ তৈরি করে যা UDP করে না।"}, {"id": 62, "topic": "Transport Layer Protocols & Services", "question": "স্টপ-অ্যান্ড-ওয়েট (Stop-and-Wait) প্রোটোকলের প্রধান সীমাবদ্ধতা কোনটি?", "options": ["ক) ট্রান্সমিটার ইউটিলাইজেশন (Link Utilization) অত্যন্ত নিম্ন, কারণ একটি প্যাকেট পাঠিয়ে ACK আসার আগ পর্যন্ত প্রেরক অলস বসে থাকে", "খ) এতে কোনো বাফার লাগে না", "গ) এটি কোনো ডেটা পাঠাতে পারে না", "ঘ) এটি খুবই জটিল"], "answer": "ক", "explanation": "স্টপ-অ্যান্ড-ওয়েটে চ্যানেল ক্যাপাসিটি বিশাল হলেও একবারে মাত্র ১টি প্যাকেট ইন-ফ্লাইট থাকতে পারে, ফলে লিঙ্কের সদ্ব্যবহার ($U_{sender}$) মারাত্মকভাবে কমে যায়।"}, {"id": 63, "topic": "Transport Layer Protocols & Services", "question": "পাইপলাইন্ড প্রোটোকল 'Go-Back-N (GBN)'-এ রিসিভার কোন ধরণের স্বীকৃতি (ACK) পাঠায়?", "options": ["ক) কিউমুলেটিভ স্বীকৃতি (Cumulative ACK)", "খ) ইন্ডিভিজুয়াল একনলেজমেন্ট", "গ) নেগেটিভ ACK কেবল", "ঘ) কোনো ACK পাঠায় না"], "answer": "ক", "explanation": "GBN কিউমুলেটিভ ACK ব্যবহার করে। যেমন ACK $n$ পাওয়া মানে হলো $n$ পর্যন্ত সমস্ত প্যাকেট রিসিভার সফলভাবে পেয়েছে। কোনো প্যাকেট হারালে $n$-এর পর থেকে উইন্ডোর সমস্ত প্যাকেট পুনরায় পাঠাতে হয়।"}, {"id": 64, "topic": "Transport Layer Protocols & Services", "question": "সিলেক্টিভ রিপিট (Selective Repeat - SR) প্রোটোকল Go-Back-N থেকে কীভাবে আলাদা?", "options": ["ক) রিসিভার প্রতিটি ত্রুটিহীন প্যাকেটের জন্য আলাদা Individual ACK দেয় এবং ক্ষতিগ্রস্ত প্যাকেটগুলোকে মেমরিতে বাফার করে কেবল হারানো প্যাকেটটিকে রিট্রান্সমিট করায়", "খ) এটি কোনো উইন্ডো ব্যবহার করে না", "গ) এটি সমস্ত প্যাকেট বাতিল করে", "ঘ) এটি GBN-এর চেয়ে কম দক্ষ"], "answer": "ক", "explanation": "Selective Repeat-এ অপ্রয়োজনীয় ডুপ্লিকেট রিট্রান্সমিশন এড়াতে রিসিভার আউট-অফ-অর্ডার প্যাকেট বাফার করে রাখে এবং প্রেরক কেবল যে প্যাকেটটি হারিয়েছে সেটিই পুনরায় পাঠায়।"}, {"id": 65, "topic": "Transport Layer Protocols & Services", "question": "সিলেক্টিভ রিপিট (SR) প্রোটোকলে সিকোয়েন্স নম্বর স্পেস $k$ হলে উইন্ডো সাইজ $N$ সর্বোচ্চ কত হতে পারে?", "options": ["ক) $N \\le 2^{k-1}$ (সিকোয়েন্স নম্বরের মোট সংখ্যার অর্ধেক)", "খ) $N = 2^k$", "গ) $N = 2^k - 1$", "ঘ) $N = k$"], "answer": "ক", "explanation": "উইন্ডো সাইজ মোট সিকোয়েন্স স্পেসের অর্ধেকের বেশি হলে পুরোনো প্যাকেটের রিট্রান্সমিশনকে নতুন উইন্ডোর প্যাকেট হিসেবে ভুল করার ঝুঁকি (Ambiguity) তৈরি হয়।"}, {"id": 66, "topic": "Transport Layer Protocols & Services", "question": "TCP (Transmission Control Protocol)-এর অন্যতম প্রধান বৈশিষ্ট্য কোনটি?", "options": ["ক) সংযোগ-ভিত্তিক (Connection-oriented), নির্ভরযোগ্য বাইট-স্ট্রিম (Reliable Byte Stream) এবং ফুল-ডুপ্লেক্স সার্ভিস", "খ) অনির্ভরযোগ্য ও মেসেজ বাউন্ডারি ভিত্তিক", "গ) মাল্টিকাস্ট ও ব্রডকাস্ট সমর্থন করে", "ঘ) কোনো ফ্লো কন্ট্রোল নেই"], "answer": "ক", "explanation": "TCP দুটি এন্ডপয়েন্টের মধ্যে থ্রি-ওয়ে হ্যান্ডশেকের মাধ্যমে ফুল-ডুপ্লেক্স নির্ভরযোগ্য বাইট-স্ট্রিম সংযোগ স্থাপন করে ডেটার সঠিক ডেলিভারি ও সিকোয়েন্স নিশ্চিত করে।"}, {"id": 67, "topic": "Transport Layer Protocols & Services", "question": "কোনো অপশন ফিল্ড ছাড়া আদর্শ TCP হেডারের ন্যূনতম আকার কত বাইট?", "options": ["ক) ২০ বাইট", "খ) ৮ বাইট", "গ) ৪০ বাইট", "ঘ) ১৬ বাইট"], "answer": "ক", "explanation": "TCP হেডারের সর্বনিম্ন আকার ২০ বাইট (যেখানে UDP মাত্র ৮ বাইট)। অপশন ফিল্ড যুক্ত থাকলে এটি সর্বোচ্চ ৬০ বাইট পর্যন্ত হতে পারে।"}, {"id": 68, "topic": "Transport Layer Protocols & Services", "question": "TCP সংযোগ স্থাপনে থ্রি-ওয়ে হ্যান্ডশেকের (Three-Way Handshake) সঠিক ধাপ কোনটি?", "options": ["ক) SYN -> SYN-ACK -> ACK", "খ) ACK -> SYN -> SYN-ACK", "গ) SYN -> FIN -> ACK", "ঘ) HELLO -> REQUEST -> OK"], "answer": "ক", "explanation": "১. ক্লায়েন্ট `SYN` সেগমেন্ট পাঠায়, ২. সার্ভার তা স্বীকার করে `SYN-ACK` পাঠায়, ৩. ক্লায়েন্ট চূড়ান্ত স্বীকৃতি হিসেবে `ACK` পাঠায় এবং সংযোগ প্রতিষ্ঠিত হয়।"}, {"id": 69, "topic": "Transport Layer Protocols & Services", "question": "TCP সংযোগ সফলভাবে সমাপ্ত বা ক্লোজ করতে কোন ফ্ল্যাগ এবং কয়টি ধাপ ব্যবহৃত হয়?", "options": ["ক) FIN ফ্ল্যাগ; ৪টি ধাপের হ্যান্ডশেক (Four-Way Teardown)", "খ) RST ফ্ল্যাগ; ১টি ধাপ", "গ) SYN ফ্ল্যাগ; ২টি ধাপ", "ঘ) PSH ফ্ল্যাগ; ৩টি ধাপ"], "answer": "ক", "explanation": "যেহেতু TCP ফুল-ডুপ্লেক্স, উভয় দিক আলাদাভাবে বন্ধ হতে হয়: $A$ পাঠায় FIN, $B$ পাঠায় ACK; পরবর্তীতে $B$ পাঠায় FIN এবং $A$ পাঠায় ACK (মোট ৪ ধাপ)।"}, {"id": 70, "topic": "Transport Layer Protocols & Services", "question": "TCP হেডারে 'Sequence Number' মূলত কী নির্দেশ করে?", "options": ["ক) সেগমেন্টের ডেটা পে-লোডের প্রথম বাইটের বাইট-স্ট্রিম নম্বর", "খ) মোট প্যাকেটের সংখ্যা", "গ) রাউটারের আইপি", "ঘ) প্রেরকের পোর্ট নম্বর"], "answer": "ক", "explanation": "TCP প্যাকেট কাউন্ট করে না বরং বাইট কাউন্ট করে। সিকোয়েন্স নম্বর হলো সেগমেন্টে পাঠানো বাইটগুলোর প্রথম বাইটের ক্রমিক নম্বর।"}, {"id": 71, "topic": "Transport Layer Protocols & Services", "question": "TCP হেডারে 'Acknowledgment Number' কী প্রকাশ করে?", "options": ["ক) পরবর্তী যে বাইটটি পাওয়ার জন্য রিসিভার অপেক্ষা করছে (Next expected byte number)", "খ) ইতোমধ্যে পাওয়া শেষ প্যাকেটের সাইজ", "গ) পোর্ট নম্বর", "ঘ) সকেট আইডি"], "answer": "ক", "explanation": "TCP-র ACK নম্বর হলো কিউমুলেটিভ: রিসিভার যদি $k$ নম্বর বাইট আশা করে, সে ACK হিসেবে $k$ পাঠায়, যার অর্থ $k-1$ পর্যন্ত সকল বাইট সঠিকভাবে পাওয়া গেছে।"}, {"id": 72, "topic": "Transport Layer Protocols & Services", "question": "TCP ফ্লো কন্ট্রোল (Flow Control)-এর মূল উদ্দেশ্য কোনটি?", "options": ["ক) প্রেরক যাতে অতিরিক্ত দ্রুত ডেটা পাঠিয়ে রিসিভারের বাফার মেমরি উপচে (Overflow) না ফেলে", "খ) নেটওয়ার্কের রাউটারগুলোকে রক্ষা করা", "গ) ইন্টারনেটের বিল কমানো", "ঘ) পাসওয়ার্ড এনক্রিপ্ট করা"], "answer": "ক", "explanation": "Flow Control নিশ্চিত করে যে দ্রুতগতির প্রেরক ধীরগতির গ্রাহকের বাফারকে ওভারফ্লো করবে না। গ্রাহক তার ফ্রি বাফার স্পেস `rwnd` (Receive Window) হেডারে জানিয়ে দেয়।"}, {"id": 73, "topic": "Transport Layer Protocols & Services", "question": "TCP ফ্লো কন্ট্রোল এবং কনজেশন কন্ট্রোলের (Congestion Control) মধ্যে পার্থক্য কী?", "options": ["ক) ফ্লো কন্ট্রোল এন্ড রিসিভারের বাফার নিয়ন্ত্রণ করে, আর কনজেশন কন্ট্রোল ইন্টারমিডিয়েট নেটওয়ার্কের রাউটার ও লিঙ্কগুলোর ওভারলোড নিয়ন্ত্রণ করে", "খ) উভয়ই সম্পূর্ণ একই মেকানিজম", "গ) ফ্লো কন্ট্রোল রাউটারে চলে", "ঘ) কনজেশন কন্ট্রোল ক্যাবলের ক্ষতি রোধ করে"], "answer": "ক", "explanation": "Flow Control হলো এন্ড-টু-এন্ড রিসিভারের সুরক্ষার জন্য ($rwnd$), আর Congestion Control হলো সমগ্র নেটওয়ার্ক ট্রাফিকের সুরক্ষার জন্য ($cwnd$)। প্রেরকের কার্যকরী উইন্ডো $= \\min(rwnd, cwnd)$।"}, {"id": 74, "topic": "Transport Layer Protocols & Services", "question": "TCP কনজেশন কন্ট্রোলে AIMD (Additive Increase, Multiplicative Decrease)-এর আচরণ কোনটি?", "options": ["ক) কোনো লস না থাকলে প্রতি RTT-তে উইন্ডো সাইজ ১ MSS করে লিনিয়ারলি বাড়ে, এবং লস শনাক্ত হলে কনজেশন উইন্ডো অর্ধেক (halved) হয়ে যায়", "খ) উইন্ডো সাইজ সবসময় স্থির থাকে", "গ) লস হলে উইন্ডো দ্বিগুণ হয়", "ঘ) প্রতি সেকেন্ডে দ্বিগুণ বাড়ে"], "answer": "ক", "explanation": "AIMD নেটওয়ার্ক স্ট্যাবিলিটির গ্যারান্টি দেয়: কোনো সমস্যা না থাকলে ধীরে ধীরে ১টি করে MSS বাড়ায় (Additive Increase) কিন্তু প্যাকেট ড্রপ হলে এক ধাক্কায় উইন্ডো অর্ধেক করে (Multiplicative Decrease)।"}, {"id": 75, "topic": "Transport Layer Protocols & Services", "question": "TCP স্লো স্টার্ট (Slow Start) পর্যায়ে কনজেশন উইন্ডো ($cwnd$) কীভাবে বৃদ্ধি পায়?", "options": ["ক) প্রতি RTT-তে এক্সপোনেনশিয়ালি বা জ্যামিতিকভাবে দ্বিগুণ (Doubles every RTT: 1, 2, 4, 8...)", "খ) লিনিয়ারলি ১ MSS করে", "গ) দ্বিগুণ হারে কমে", "ঘ) কোনো পরিবর্তন হয় না"], "answer": "ক", "explanation": "নাম 'Slow Start' হলেও এটি অত্যন্ত দ্রুত ব্যান্ডউইথ খুঁজে নিতে প্রতি সফল ACK-এর জন্য $cwnd$ বাড়িয়ে প্রতি RTT-তে উইন্ডো সাইজ দ্বিগুণ (Exponentially) করে।"}, {"id": 76, "topic": "Transport Layer Protocols & Services", "question": "স্লো স্টার্ট থেকে কনজেশন অ্যাভয়ডেন্স (Congestion Avoidance) মোডে যাওয়ার রূপান্তরকারী সীমাকে কী বলে?", "options": ["ক) ssthresh (Slow Start Threshold)", "খ) MSS", "গ) MTU", "ঘ) TTL"], "answer": "ক", "explanation": "যখন $cwnd \\ge ssthresh$ হয়, তখন এক্সপোনেনশিয়াল বৃদ্ধি বন্ধ হয়ে লিনিয়ার বৃদ্ধি (প্রতি RTT-তে ১ MSS) শুরু হয় যাকে Congestion Avoidance বলে।"}, {"id": 77, "topic": "Transport Layer Protocols & Services", "question": "TCP ফাস্ট রিট্রান্সমিট (Fast Retransmit) কখন সক্রিয় হয়?", "options": ["ক) টাইমার এক্সপায়ার হওয়ার আগেই পরপর ৩টি ডুপ্লিকেট ACK (Triple Duplicate ACKs) আসলে", "খ) রিসিভার অফলাইন হলে", "গ) ক্যাবল ডিসকানেক্ট হলে", "ঘ) রাউটার রিবুট হলে"], "answer": "ক", "explanation": "একই ACK পরপর ৩ বার ডুপ্লিকেট পাওয়া মানে মাঝের একটি প্যাকেট হারিয়েছে কিন্তু পরবর্তী প্যাকেটগুলো রিসিভার পাচ্ছে। ফলে দীর্ঘ টাইম-আউটের অপেক্ষা না করে অবিলম্বে হারানো প্যাকেট রিট্রান্সমিট করা হয়।"}, {"id": 78, "topic": "Transport Layer Protocols & Services", "question": "TCP Tahoe এবং TCP Reno সংস্করণের মধ্যে প্রধান পার্থক্য কোথায়?", "options": ["ক) ৩টি ডুপ্লিকেট ACK পেলে Tahoe তার $cwnd$ নামিয়ে ১ MSS-এ নিয়ে যায়, কিন্তু Reno ফাস্ট রিকভারি করে $cwnd$ কে অর্ধেক ($\u0007pprox ssthresh$) থেকে শুরু করে", "খ) Tahoe অনেক আধুনিক", "গ) Reno-তে কোনো স্লো স্টার্ট নেই", "ঘ) Reno কোনো উইন্ডো সাইজ ব্যবহার করে না"], "answer": "ক", "explanation": "TCP Reno ফাস্ট রিকভারি অ্যালগরিদম প্রবর্তন করে যা ট্রিপল ডুপ্লিকেট অ্যাকে উইন্ডো সাইজ ১ না করে অর্ধেক করে লিনিয়ার বৃদ্ধি বজায় রাখে।"}, {"id": 79, "topic": "Transport Layer Protocols & Services", "question": "TCP-তে রিট্রান্সমিশন টাইম-আউট (RTO) সময় নির্ধারণ করতে কোন প্যারামিটার ডায়নামিকভাবে হিসাব করা হয়?", "options": ["ক) Smoothed Round-Trip Time (SRTT) এবং RTT বৈচিত্র্য (RTT Variation)", "খ) ব্যান্ডউইথ গুণফল", "গ) ইউজারের স্ক্রিন সাইজ", "ঘ) কেবল স্ট্যাটিক ১ সেকেন্ড সময়"], "answer": "ক", "explanation": "TCP জ্যাকবসন-ক্যারেলস অ্যালগরিদম দিয়ে স্যাম্পল RTT-র এক্সপোনেনশিয়াল ওয়েটেড মুভিং এভারেজ (EWMA) ও ভ্যারিয়েন্স হিসাব করে ডায়নামিক RTO সেট করে।"}, {"id": 80, "topic": "Transport Layer Protocols & Services", "question": "TCP হেডারে 'RST' (Reset) ফ্ল্যাগ কী উদ্দেশ্যে ব্যবহৃত হয়?", "options": ["ক) কোনো অবৈধ সেগমেন্ট পেলে বা অনুরোধকৃত পোর্টে কোনো লিসেনিং সার্ভিস না থাকলে সংযোগ তাৎক্ষণিকভাবে নাকচ/বাতিল করতে", "খ) স্বাভাবিকভাবে ডেটা পাঠাতে", "গ) কিউমুলেটিভ স্বীকৃতি জানাতে", "ঘ) বাফার বড় করতে"], "answer": "ক", "explanation": "RST ফ্ল্যাগ সংযোগ অপ্রত্যাশিতভাবে ভেঙে গেলে বা বন্ধ পোর্টে SYN আসলে বিপরীত প্রান্তকে তৎক্ষণাৎ সকেট বন্ধ করার বার্তা পাঠায়।"}, {"id": 81, "topic": "Network Layer - Data Plane & IP Addressing", "question": "নেটওয়ার্ক লেয়ারের 'ফরওয়ার্ডিং' (Forwarding) এবং 'রাউটিং' (Routing)-এর মধ্যে পার্থক্য কী?", "options": ["ক) ফরওয়ার্ডিং হলো রাউটারের ইনপুট পোর্ট থেকে উপযুক্ত আউটপুট পোর্টে লোকাল প্যাকেট ট্রান্সফার (Data Plane), আর রাউটিং হলো সোর্স থেকে ডেস্টিনেশনের সামগ্রিক রুট নির্ধারণ (Control Plane)", "খ) ফরওয়ার্ডিং শুধুমাত্র সফটওয়্যারে হয়, রাউটিং হয় ফিজিক্যাল তারে", "গ) উভয়েই সম্পূর্ণ অভিন্ন ধারণা", "ঘ) রাউটিং শুধুমাত্র লোকাল এরিয়া নেটওয়ার্
